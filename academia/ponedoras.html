const GLOSSARY = [
["Alimento balanceado","Mezcla formulada con los nutrientes que la gallina necesita en cada etapa."],
["Bioseguridad","Conjunto de medidas para evitar que las enfermedades entren o salgan de la granja."],
["Capital de trabajo","Dinero para operar (alimento, sueldos, gastos) mientras llegan los ingresos."],
["Conversión alimenticia","Kilos de alimento necesarios para producir un kilo de huevo. Menos es mejor."],
["Descarte (gallina de saca)","Gallina que termina su ciclo productivo y se vende para consumo."],
["Depreciación","Reparto del costo de un bien duradero durante su vida útil."],
["Gallinaza","Estiércol de gallina; compostado se usa como abono."],
["Línea genética","Tipo de ave seleccionado para producir, como Hy-Line Brown o Lohmann Brown."],
["Lote o parvada","Grupo de aves de la misma edad que se manejan juntas."],
["Nidal o nido","Lugar donde la gallina pone; en piso, 1 por cada 4 a 5 aves."],
["Ovoscopio","Luz para revisar el huevo por dentro y detectar fisuras."],
["Pediluvio","Bandeja con desinfectante para las botas en la entrada del galpón."],
["Periodo de retiro","Tiempo tras un medicamento en que los huevos no deben venderse."],
["Pico de postura","Momento de máxima producción del lote, entre las semanas 25 y 32 aproximadamente."],
["% de postura","Huevos del día divididos entre gallinas vivas, por 100."],
["Polla recriada","Ave de 16 a 18 semanas, lista para iniciar postura."],
["Precio de equilibrio","Precio mínimo al que no ganas ni pierdes."],
["Punto de equilibrio","Nivel de ventas en que ingresos y costos son iguales."],
["TCEA","Tasa de costo efectivo anual: costo total real de un crédito."],
["TIR","Tasa interna de retorno: rentabilidad anual de un proyecto."],
["VAN","Valor actual neto: ganancia del proyecto expresada en dinero de hoy."],
["Vacío sanitario","Tiempo que el galpón queda vacío y desinfectado entre lotes."]
];

const PLAN_FIELDS = [
{id:"resumen", t:"1. Resumen ejecutivo", h:"Escríbelo al final: en 5 a 8 líneas, qué harás, para quién, cuánto necesitas y cuánto esperas ganar."},
{id:"propuesta", t:"2. Idea y propuesta de valor", h:"Tu frase: 'Ofrezco [producto] a [cliente] que necesita [necesidad], y me diferencio porque [razón]'."},
{id:"mercado", t:"3. Mercado y competencia", h:"Precios que encontraste, segmentos elegidos, cuántos clientes confirmaste y quiénes son tus competidores."},
{id:"marketing", t:"4. Marketing y marca", h:"Nombre, promesa, presentaciones, precio y cómo te darás a conocer."},
{id:"comercial", t:"5. Comercialización", h:"Canales, clientes clave, días y ruta de reparto, formas de pago y crédito."},
{id:"operaciones", t:"6. Plan de operaciones", h:"Ubicación, sistema de crianza, número de aves, línea genética, instalaciones, proveedores, plan sanitario y bioseguridad."},
{id:"sostenibilidad", t:"7. Sostenibilidad y responsabilidad social", h:"Manejo de gallinaza, bienestar animal, relación con vecinos y comunidad."},
{id:"organizacion", t:"8. Organización y aspectos legales", h:"Quién hace qué, rutina, formalización (RUC, régimen, SENASA, municipalidad)."},
{id:"finanzas", t:"9. Plan financiero", h:"Inversión total, capital de trabajo, costo por huevo, utilidad mensual, recuperación, escenarios y financiamiento. Usa los resultados de la calculadora."},
{id:"riesgos", t:"10. Riesgos y cronograma", h:"Tus 5 riesgos principales con su mitigación, y los pasos con fechas."}
];

</script>
<script>
(function(){
const KEY = "avicurso:v1";
let S = {read:{}, quiz:{}, tasks:{}, calc:null, plan:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const $ = (s, r=document) => r.querySelector(s);
const main = $("#main"), nav = $("#nav"), aside = $("#sidebar"), toggle = $("#menuToggle");
let eggId = 0;
let current = {view:"inicio", lesson:0};

function egg(pct, cls){
  const id = "e" + (eggId++);
  const h = Math.round(24 * Math.max(0, Math.min(1, pct)));
  return `<svg class="${cls||"egg"}" viewBox="0 0 20 26" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="M10 1C5.2 1 1.5 9 1.5 15.2a8.5 8.5 0 0 0 17 0C18.5 9 14.8 1 10 1z"/></clipPath></defs>
    <rect x="0" y="0" width="20" height="26" fill="var(--surface)" clip-path="url(#${id})"/>
    <rect x="0" y="${26-h}" width="20" height="${h}" fill="var(--yolk)" clip-path="url(#${id})"/>
    <path d="M10 1C5.2 1 1.5 9 1.5 15.2a8.5 8.5 0 0 0 17 0C18.5 9 14.8 1 10 1z" fill="none" stroke="var(--shell)" stroke-width="1.4"/>
  </svg>`;
}

function modProgress(m){
  const read = (S.read[m.id]||[]).length;
  const q = S.quiz[m.id]||{};
  const quizDone = Object.keys(q).length >= m.quiz.length ? 1 : 0;
  return (read + quizDone) / (m.lessons.length + 1);
}
function totalProgress(){
  return MODULES.reduce((a,m)=>a+modProgress(m),0) / MODULES.length;
}

function renderNav(){
  let h = `<div class="nav-group">Empieza aquí</div>
  <button class="nav-btn" data-go="inicio" ${current.view==="inicio"?'aria-current="page"':""}>${egg(totalProgress())}<span>Inicio y cómo usar el curso</span></button>
  <div class="nav-group">Módulos</div>`;
  MODULES.forEach(m=>{
    h += `<button class="nav-btn" data-go="${m.id}" ${current.view===m.id?'aria-current="page"':""}>${egg(modProgress(m))}<span class="num">${m.num}</span><span>${m.title}</span></button>`;
  });
  h += `<div class="nav-group">Herramientas</div>
  <button class="nav-btn" data-go="calc" ${current.view==="calc"?'aria-current="page"':""}><span class="num">S/</span><span>Calculadora de rentabilidad</span></button>
  <button class="nav-btn" data-go="plan" ${current.view==="plan"?'aria-current="page"':""}><span class="num">✎</span><span>Mi plan de negocio</span></button>
  <button class="nav-btn" data-go="glosario" ${current.view==="glosario"?'aria-current="page"':""}><span class="num">Aa</span><span>Glosario</span></button>`;
  nav.innerHTML = h;
}

function go(view, lesson){
  current = {view, lesson: lesson||0};
  S.last = view; save();
  render();
  aside.classList.remove("open"); toggle.setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  main.focus({preventScroll:true});
}

document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]");
  if (g){ e.preventDefault(); go(g.dataset.go); }
});
toggle.addEventListener("click", ()=>{
  const open = aside.classList.toggle("open");
  toggle.setAttribute("aria-expanded", open ? "true":"false");
});

/* ---------- Inicio ---------- */
function viewInicio(){
  const p = Math.round(totalProgress()*100);
  let cards = MODULES.map(m=>`<button data-go="${m.id}">${egg(modProgress(m))}<strong>${m.num}. ${m.title}</strong><span>${m.lessons.length} lecciones y quiz</span></button>`).join("");
  return `<section class="hero">
    <div>
      <h1>De cero a tu granja de gallinas ponedoras</h1>
      <p class="lead">Un curso práctico que resume los temas de los diplomas de ESAN en Gestión de Negocios Avícolas y en Planes de Negocios para Proyectos Avícolas, adaptado a una granja pequeña en el Perú.</p>
      <div class="row">
        <button class="btn" data-go="${S.last && S.last.startsWith("m") ? S.last : "m1"}">${p>0?"Continuar el curso":"Empezar el módulo 1"}</button>
        <button class="btn ghost" data-go="calc">Abrir la calculadora</button>
      </div>
    </div>
    <div>${egg(totalProgress(),"hero-egg")}<p class="muted" style="text-align:center;font-family:var(--display);margin-top:.3rem">${p}% completado</p></div>
  </section>
  <div class="reading">
    <h2>Cómo usar este curso</h2>
    <p>Cada módulo tiene lecciones cortas, recuadros con ideas clave, tareas para hacer en el campo y un quiz de repaso. El huevo al lado de cada módulo se llena a medida que marcas lecciones como leídas y respondes el quiz. Tu avance, tus respuestas y tu plan se guardan en este navegador.</p>
    <p>El orden recomendado es del 1 al 9: primero el mercado, luego cómo vender, después cómo producir y, al final, los números y el plan. El módulo 9 te guía para armar tu plan de negocio en la plantilla del menú, apoyándote en la calculadora.</p>
    <div class="box ojo"><span class="bt">Antes de empezar</span><p>Las cifras técnicas y de precios son referencias para aprender. Reemplázalas siempre por cotizaciones reales de tu zona, la guía de manejo de tu línea genética y la asesoría de un médico veterinario y un contador.</p></div>
  </div>
  <h2 style="margin-top:2rem">Mapa del curso</h2>
  <div class="map">${cards}</div>`;
}

/* ---------- Módulo ---------- */
function viewModule(m){
  const li = current.lesson;
  const L = m.lessons[li];
  const read = S.read[m.id]||[];
  const tabs = m.lessons.map((l,i)=>`<button role="tab" aria-selected="${i===li}" class="${read.includes(i)?"done":""}" data-lesson="${i}">${i+1}. ${l.t}</button>`).join("");
  const isRead = read.includes(li);
  const nextLabel = li < m.lessons.length-1 ? "Marcar como leída y seguir" : "Marcar como leída e ir al quiz";
  const tasks = S.tasks[m.id]||[];
  const idx = MODULES.indexOf(m);
  return `<header class="mod-head">
      <div class="bignum" aria-hidden="true">${m.num}</div>
      <div class="src">Basado en: ${m.src}</div>
      <h2>${m.title}</h2>
      <p class="muted" style="margin:0">${m.intro}</p>
    </header>
    <div class="tabs" role="tablist" aria-label="Lecciones">${tabs}</div>
    <article class="lesson reading" aria-live="polite">${L.html}</article>
    <div class="lesson-foot reading">
      <button class="btn ghost small" data-lesson="${li-1}" ${li===0?"disabled":""}>Lección anterior</button>
      <button class="btn small" id="markRead">${isRead && li===m.lessons.length-1 ? "Ir al quiz" : nextLabel}</button>
    </div>
    <section class="panel reading" id="tareas">
      <h3>Tareas de campo</h3>
      <p class="muted">Lo que aprendes se vuelve real cuando lo haces. Marca cada tarea al completarla.</p>
      <div class="tasks">${m.tasks.map((t,i)=>`<label><input type="checkbox" data-task="${i}" ${tasks[i]?"checked":""}><span>${t}</span></label>`).join("")}</div>
    </section>
    <section class="panel reading" id="quiz">
      <h3>Quiz del módulo</h3>
      <div id="quizBody"></div>
    </section>
    <div class="lesson-foot reading">
      ${idx>0?`<button class="btn ghost small" data-go="${MODULES[idx-1].id}">Módulo ${idx}</button>`:"<span></span>"}
      ${idx<MODULES.length-1?`<button class="btn small" data-go="${MODULES[idx+1].id}">Módulo ${idx+2}: ${MODULES[idx+1].title}</button>`:`<button class="btn small" data-go="plan">Ir a mi plan de negocio</button>`}
    </div>`;
}

function renderQuiz(m){
  const box = $("#quizBody"); if(!box) return;
  const ans = S.quiz[m.id]||{};
  let correct = 0, answered = 0;
  box.innerHTML = m.quiz.map((q,qi)=>{
    const a = ans[qi];
    const done = a !== undefined;
    if(done){ answered++; if(a===q.a) correct++; }
    const opts = q.o.map((o,oi)=>{
      let c = "opt";
      if(done && oi===q.a) c+=" ok";
      if(done && oi===a && a!==q.a) c+=" bad";
      return `<button class="${c}" data-q="${qi}" data-o="${oi}" ${done?"disabled":""}>${o}</button>`;
    }).join("");
    const fb = done ? `<div class="fb"><b>${a===q.a?"Correcto.":"No exactamente."}</b> ${q.e}</div>` : "";
    return `<div class="q"><p>${qi+1}. ${q.q}</p><div class="opts">${opts}</div>${fb}</div>`;
  }).join("") + (answered===m.quiz.length ? `<p class="score">Resultado: ${correct} de ${m.quiz.length}. <button class="btn ghost small" id="retry">Volver a intentar</button></p>` : "");
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const qi=+b.dataset.q, oi=+b.dataset.o;
    S.quiz[m.id] = S.quiz[m.id]||{}; S.quiz[m.id][qi]=oi; save();
    renderQuiz(m); renderNav();
  }));
  const r = $("#retry"); if(r) r.addEventListener("click",()=>{ S.quiz[m.id]={}; save(); renderQuiz(m); renderNav(); });
}

function bindModule(m){
  main.querySelectorAll("[data-lesson]").forEach(b=>b.addEventListener("click",()=>{
    const i = +b.dataset.lesson; if(i<0) return;
    current.lesson = i; render(); $(".tabs").scrollIntoView({block:"start"});
  }));
  $("#markRead").addEventListener("click",()=>{
    const r = S.read[m.id] = S.read[m.id]||[];
    if(!r.includes(current.lesson)) r.push(current.lesson);
    save();
    if(current.lesson < m.lessons.length-1){ current.lesson++; render(); $(".tabs").scrollIntoView({block:"start"}); }
    else { render(); $("#quiz").scrollIntoView({block:"start"}); }
  });
  main.querySelectorAll("[data-task]").forEach(c=>c.addEventListener("change",()=>{
    S.tasks[m.id] = S.tasks[m.id]||[]; S.tasks[m.id][+c.dataset.task] = c.checked; save();
  }));
  renderQuiz(m);
}

/* ---------- Calculadora ---------- */
const CF = [
 {k:"aves",l:"Número de gallinas al inicio",s:"Tamaño de tu lote.",v:300},
 {k:"pPolla",l:"Precio por polla recriada (S/)",s:"Valor de ejemplo; cotiza con proveedores formales.",v:25},
 {k:"postura",l:"Postura promedio del ciclo (%)",s:"Entre 75% y 85% con buen manejo.",v:78},
 {k:"peso",l:"Peso promedio del huevo (g)",s:"Entre 58 y 63 g es habitual.",v:61},
 {k:"precio",l:"Precio de venta (S/ por kg de huevo)",s:"Referencia 2026: mayorista cerca de S/ 6.5; minorista cerca de S/ 7.8.",v:7.0},
 {k:"consumo",l:"Consumo de alimento (g por ave al día)",s:"Entre 105 y 120 g.",v:112},
 {k:"pAlim",l:"Precio del alimento de postura (S/ por kg)",s:"Valor de ejemplo; cotiza en tu zona.",v:2.1},
 {k:"mort",l:"Mortalidad en el ciclo (%)",s:"Meta: menos de 5% a 8%.",v:8},
 {k:"meses",l:"Meses de postura del lote",s:"De la semana 19 a la 80 son unos 14 meses.",v:14},
 {k:"descarte",l:"Venta de cada gallina de descarte (S/)",s:"Lo que recibes al final por ave.",v:12},
 {k:"otros",l:"Otros costos al mes (S/)",s:"Vacunas, luz, agua, cama, empaque, transporte.",v:450},
 {k:"mo",l:"Mano de obra al mes (S/)",s:"Incluye un sueldo para ti, aunque sea simbólico.",v:500},
 {k:"inv",l:"Inversión en instalaciones y equipos (S/)",s:"Galpón o adecuación, mallas, comederos, nidos, luz.",v:10000},
 {k:"vida",l:"Vida útil de instalaciones (años)",s:"Normalmente 5 a 10 años.",v:5},
 {k:"ct",l:"Capital de trabajo inicial (S/)",s:"Alimento y gastos de 2 a 3 meses.",v:6000}
];
const PRESETS = {
 "Huevo común a bodegas": {precio:6.8},
 "Venta directa a familias": {precio:8.0},
 "Huevo de pastoreo premium": {precio:12.0, postura:72, mort:10, otros:650}
};
function calcVals(){ const d={}; CF.forEach(f=>d[f.k]=f.v); return Object.assign(d, S.calc||{}); }
function compute(v, adj){
  adj = adj||{};
  const precio = v.precio*(adj.precio||1), pAlim = v.pAlim*(adj.alim||1), postura = Math.max(0, v.postura + (adj.postura||0));
  const D = 30.4;
  const avesProm = v.aves*(1 - v.mort/200);
  const huevosDia = avesProm*postura/100;
  const huevosMes = huevosDia*D;
  const kgMes = huevosMes*v.peso/1000;
  const ingreso = kgMes*precio;
  const alimKg = avesProm*v.consumo/1000*D;
  const alimento = alimKg*pAlim;
  const depAves = (v.aves*v.pPolla - v.aves*(1-v.mort/100)*v.descarte)/Math.max(1,v.meses);
  const depInst = v.inv/Math.max(1,v.vida*12);
  const costo = alimento + v.otros + v.mo + depAves + depInst;
  const util = ingreso - costo;
  const flujo = util + depAves + depInst;
  const invTotal = v.inv + v.aves*v.pPolla + v.ct;
  return {avesProm, huevosDia, huevosMes, kgMes, ingreso, alimento, alimKg, depAves, depInst, costo, util, flujo, invTotal,
    costoHuevo: costo/Math.max(1,huevosMes), eqKg: costo/Math.max(0.001,kgMes), conv: alimKg/Math.max(0.001,kgMes),
    payback: flujo>0 ? invTotal/flujo : null, precioHuevo: precio*v.peso/1000, pctAlim: alimento/costo};
}
const fm = (n,d=0)=> n.toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const S_ = (n,d=0)=> (n<0?"−":"")+"S/ "+fm(Math.abs(n),d);

function viewCalc(){
  const v = calcVals();
  return `<header class="mod-head"><div class="src">Herramienta de los módulos 6, 7 y 9</div><h2>Calculadora de rentabilidad</h2>
  <p class="muted" style="margin:0">Cambia los valores de ejemplo por tus cotizaciones. Los resultados son mensuales y aproximados; se guardan automáticamente.</p></header>
  <div class="presets no-print"><span class="muted" style="font-family:var(--display);font-size:.9rem;margin-right:.4rem">Probar un modelo:</span>${Object.keys(PRESETS).map(p=>`<button class="btn ghost small" data-preset="${p}">${p}</button>`).join("")}<button class="btn ghost small" id="resetCalc">Restaurar ejemplo</button></div>
  <div class="calc" style="margin-top:1rem">
    <div class="fields">${CF.map(f=>`<div class="field"><label for="f_${f.k}">${f.l}</label><small>${f.s}</small><input id="f_${f.k}" type="number" inputmode="decimal" step="any" min="0" data-k="${f.k}" value="${v[f.k]}"></div>`).join("")}</div>
    <div class="results panel" id="results" style="margin:0"></div>
  </div>`;
}
function renderResults(){
  const v = calcVals(), r = compute(v), p = compute(v,{precio:.9, alim:1.1, postura:-5});
  const cls = n => n>=0?"pos":"neg";
  let verdict;
  if (r.util>0 && p.util>0) verdict = `<div class="verdict granja box" style="margin:1rem 0 0"><span class="bt">Modelo sólido</span>Gana incluso en el escenario pesimista. Verifica tus supuestos con datos reales antes de invertir.</div>`;
  else if (r.util>0) verdict = `<div class="verdict idea box" style="margin:1rem 0 0"><span class="bt">Rentable pero frágil</span>Gana en el escenario esperado, pero pierde si el precio baja 10%, el alimento sube 10% y la postura cae 5 puntos. Busca más diferenciación, mejor eficiencia o un fondo de reserva mayor.</div>`;
  else verdict = `<div class="verdict ojo box" style="margin:1rem 0 0"><span class="bt">Así no conviene empezar</span>Tu costo supera tus ventas. Para cubrir costos necesitarías vender al menos a ${S_(r.eqKg,2)} por kg (${S_(r.eqKg*v.peso/1000*30,2)} por plancha). Prueba otro modelo de venta o reduce costos.</div>`;
  $("#results").innerHTML = `<h3>Resultado mensual</h3>
   <div class="res"><span>Huevos por día</span><b>${fm(r.huevosDia)}</b></div>
   <div class="res"><span>Huevos por mes</span><b>${fm(r.huevosMes)}</b></div>
   <div class="res"><span>Kilos de huevo por mes</span><b>${fm(r.kgMes)} kg</b></div>
   <div class="res"><span>Precio por huevo</span><b>${S_(r.precioHuevo,2)}</b></div>
   <div class="res"><span>Precio por plancha de 30</span><b>${S_(r.precioHuevo*30,2)}</b></div>
   <div class="res"><span>Ingresos</span><b>${S_(r.ingreso)}</b></div>
   <div class="res"><span>Alimento (${fm(r.alimKg)} kg, ${fm(r.pctAlim*100)}% del costo)</span><b>${S_(r.alimento)}</b></div>
   <div class="res"><span>Otros costos y mano de obra</span><b>${S_(v.otros+v.mo)}</b></div>
   <div class="res"><span>Depreciación del lote</span><b>${S_(r.depAves)}</b></div>
   <div class="res"><span>Depreciación de instalaciones</span><b>${S_(r.depInst)}</b></div>
   <div class="res total"><span>Utilidad mensual</span><b class="${cls(r.util)}">${S_(r.util)}</b></div>
   <div class="res"><span>Costo por huevo</span><b>${S_(r.costoHuevo,3)}</b></div>
   <div class="res"><span>Precio de equilibrio</span><b>${S_(r.eqKg,2)} por kg</b></div>
   <div class="res"><span>Conversión alimenticia</span><b>${fm(r.conv,2)}</b></div>
   <div class="res"><span>Inversión total (con aves y capital de trabajo)</span><b>${S_(r.invTotal)}</b></div>
   <div class="res"><span>Flujo de caja mensual aprox.</span><b class="${cls(r.flujo)}">${S_(r.flujo)}</b></div>
   <div class="res"><span>Recuperación de la inversión</span><b>${r.payback? fm(r.payback,1)+" meses":"No se recupera"}</b></div>
   <div class="res"><span>Escenario pesimista: utilidad</span><b class="${cls(p.util)}">${S_(p.util)}</b></div>
   ${verdict}`;
}
function bindCalc(){
  main.querySelectorAll("input[data-k]").forEach(i=>i.addEventListener("input",()=>{
    const n = parseFloat(i.value); if (isNaN(n)) return;
    S.calc = S.calc||{}; S.calc[i.dataset.k]=n; save(); renderResults();
  }));
  main.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{
    S.calc = Object.assign({}, S.calc||{}, PRESETS[b.dataset.preset]); save(); render();
  }));
  $("#resetCalc").addEventListener("click",()=>{ S.calc=null; save(); render(); });
  renderResults();
}
function calcSummary(){
  const v = calcVals(), r = compute(v), p = compute(v,{precio:.9, alim:1.1, postura:-5});
  return `Supuestos: ${v.aves} gallinas, postura promedio ${v.postura}%, precio ${S_(v.precio,2)} por kg, alimento ${S_(v.pAlim,2)} por kg.\n`+
  `Inversión total: ${S_(r.invTotal)} (instalaciones ${S_(v.inv)}, aves ${S_(v.aves*v.pPolla)}, capital de trabajo ${S_(v.ct)}).\n`+
  `Ingresos mensuales: ${S_(r.ingreso)}. Costo mensual: ${S_(r.costo)}. Utilidad mensual: ${S_(r.util)}.\n`+
  `Costo por huevo: ${S_(r.costoHuevo,3)}. Precio de equilibrio: ${S_(r.eqKg,2)} por kg.\n`+
  `Recuperación: ${r.payback? fm(r.payback,1)+" meses":"no se recupera con estos supuestos"}. Escenario pesimista: utilidad ${S_(p.util)}.`;
}

/* ---------- Plan ---------- */
function esc(t){ return (t||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function viewPlan(){
  return `<header class="mod-head"><div class="src">Plan integrador (módulo 9)</div><h2>Mi plan de negocio</h2>
  <p class="muted" style="margin:0">Completa cada sección con lo que trabajaste en los módulos. Todo se guarda solo en este navegador.</p></header>
  <div class="reading">
  ${PLAN_FIELDS.map(f=>`<div class="plan-sec"><label for="p_${f.id}">${f.t}</label><small>${f.h}</small><textarea id="p_${f.id}" data-p="${f.id}">${esc(S.plan[f.id])}</textarea>
   ${f.id==="finanzas"?`<button class="btn ghost small no-print" id="pullCalc" style="margin-top:.5rem">Agregar resultados de la calculadora</button>`:""}</div>`).join("")}
  <div class="row no-print"><button class="btn" id="showPlan">Ver mi plan completo</button><span class="saved" id="savedMsg"></span></div>
  <div id="planPreview" hidden></div>
  </div>`;
}
function bindPlan(){
  let t;
  main.querySelectorAll("textarea[data-p]").forEach(a=>a.addEventListener("input",()=>{
    S.plan[a.dataset.p]=a.value; save();
    clearTimeout(t); $("#savedMsg").textContent="Guardado"; t=setTimeout(()=>$("#savedMsg").textContent="",1500);
  }));
  $("#pullCalc").addEventListener("click",()=>{
    const a = $("#p_finanzas"); a.value = (a.value? a.value.trim()+"\n\n":"") + calcSummary();
    S.plan.finanzas = a.value; save();
  });
  $("#showPlan").addEventListener("click",()=>{
    const pv = $("#planPreview");
    pv.innerHTML = `<h2>Plan de negocio: granja de gallinas ponedoras</h2>` +
      PLAN_FIELDS.map(f=>`<h4>${f.t}</h4>${S.plan[f.id]? esc(S.plan[f.id]).split(/\n+/).map(x=>`<p>${x}</p>`).join("") : `<p class="empty">Sección pendiente.</p>`}`).join("") +
      `<div class="row no-print" style="margin-top:1.5rem"><button class="btn" id="printPlan">Imprimir o guardar como PDF</button><button class="btn ghost" id="copyPlan">Copiar texto</button><span class="saved" id="copyMsg"></span></div>`;
    pv.hidden = false; pv.scrollIntoView({block:"start"});
    $("#printPlan").addEventListener("click",()=>{ try{ window.print(); }catch(e){ $("#copyMsg").textContent="Tu navegador no permite imprimir desde aquí; usa Copiar texto."; } });
    $("#copyPlan").addEventListener("click", async ()=>{
      const txt = PLAN_FIELDS.map(f=>f.t+"\n"+(S.plan[f.id]||"(pendiente)")).join("\n\n");
      try { await navigator.clipboard.writeText(txt); $("#copyMsg").textContent="Copiado"; }
      catch(e){ $("#copyMsg").textContent="No se pudo copiar automáticamente; selecciona el texto del plan y cópialo."; }
    });
  });
}

/* ---------- Glosario ---------- */
function viewGloss(){
  return `<header class="mod-head"><h2>Glosario</h2><p class="muted" style="margin:0">Los términos del curso en palabras simples.</p></header>
  <dl class="gloss reading">${GLOSSARY.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`;
}

function render(){
  eggId = 0;
  const v = current.view;
  const m = MODULES.find(x=>x.id===v);
  if (m){ main.innerHTML = viewModule(m); bindModule(m); }
  else if (v==="calc"){ main.innerHTML = viewCalc(); bindCalc(); }
  else if (v==="plan"){ main.innerHTML = viewPlan(); bindPlan(); }
  else if (v==="glosario"){ main.innerHTML = viewGloss(); }
  else { current.view="inicio"; main.innerHTML = viewInicio(); }
  renderNav();
}
(function(){const h=decodeURIComponent(location.hash.slice(1));if(h&&(MODULES.some(m=>m.id===h)||["calc","plan","glosario","inicio"].includes(h)))current={view:h,lesson:0};})();
render();
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&(MODULES.some(m=>m.id===h)||["calc","plan","glosario","inicio"].includes(h)))go(h);});
})();

</script>
