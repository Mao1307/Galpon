<style>
:root{
  --bg:#EDF0EA; --surface:#F9FAF6; --ink:#1E2922; --muted:#56635A; --line:#C9D1C6;
  --yolk:#E9A20F; --yolk-soft:#FBEBC0; --shell:#8C4F2B; --leaf:#2F6446; --leaf-soft:#DCE8DE;
  --warn:#A3401F; --warn-soft:#F6DDD2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141916; --surface:#1C231E; --ink:#E6ECE5; --muted:#9FAEA2; --line:#314036;
    --yolk:#F2B42A; --yolk-soft:#3B3013; --shell:#D8976C; --leaf:#86C09B; --leaf-soft:#1F3226;
    --warn:#E8927A; --warn-soft:#3A231B;
  }
}
:root[data-theme="dark"]{
  --bg:#141916; --surface:#1C231E; --ink:#E6ECE5; --muted:#9FAEA2; --line:#314036;
  --yolk:#F2B42A; --yolk-soft:#3B3013; --shell:#D8976C; --leaf:#86C09B; --leaf-soft:#1F3226;
  --warn:#E8927A; --warn-soft:#3A231B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.7;min-height:100%}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:800}
h3{font-size:1.3rem;font-weight:700;margin-top:1.6em}
h4{font-size:1.05rem;font-weight:700;margin-top:1.2em}
p{margin:0 0 1em}
a{color:var(--leaf)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:1.4rem 1rem 2rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.2;margin:0 .4rem 1.2rem;display:block;color:var(--ink);text-decoration:none}
.brand small{display:block;font-weight:500;font-size:.85rem;color:var(--muted);margin-top:.25rem}
.nav-group{font-family:var(--display);font-size:.8rem;color:var(--muted);margin:1.2rem .5rem .4rem}
.nav-btn{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:.5rem .55rem;border-radius:10px;font-family:var(--display);font-size:.95rem;line-height:1.25}
.nav-btn:hover{background:var(--leaf-soft)}
.nav-btn[aria-current="page"]{background:var(--yolk-soft);font-weight:700}
.nav-btn .num{font-weight:800;color:var(--shell);min-width:1.2em}
.egg{width:22px;height:28px;flex:none}
.menu-toggle{display:none}
.topbar-mg{display:contents}
a.mg-home{text-decoration:none}
.backlink{display:block;font-family:var(--display);font-size:.85rem;color:var(--muted);margin:0 .5rem .6rem;text-decoration:none}
.backlink:hover{color:var(--ink);text-decoration:underline}

main{padding:2.4rem clamp(1.1rem,4vw,3.5rem) 5rem;max-width:960px;width:100%}
.reading{max-width:70ch}
.muted{color:var(--muted)}

/* Inicio */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:2rem;align-items:center;margin-bottom:2.5rem}
.hero-egg{width:190px;height:240px}
.hero p.lead{font-size:1.2rem;color:var(--muted);max-width:52ch}
.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:.55rem 1.2rem;font-family:var(--display);font-weight:700;font-size:1rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:.3rem .9rem;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin:1.5rem 0}
.map button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1rem 1.1rem;text-align:left;color:var(--ink);display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;align-items:start}
.map button:hover{border-color:var(--shell)}
.map .egg{grid-row:span 2;width:30px;height:38px}
.map strong{font-family:var(--display);font-size:1rem;line-height:1.25}
.map span{font-size:.85rem;color:var(--muted);font-family:var(--display)}

/* Módulo */
.mod-head{border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1.5rem}
.mod-head .src{font-family:var(--display);font-size:.9rem;color:var(--shell);margin-bottom:.4rem}
.mod-head .bignum{font-family:var(--display);font-weight:800;font-size:4.5rem;line-height:.9;color:var(--yolk);float:right;margin-left:1rem}
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:1.4rem;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.35rem .9rem;font-family:var(--display);font-size:.9rem;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--bg);font-weight:700}
.tabs button.done::after{content:" ✓"}
.lesson h3:first-child{margin-top:0}
.lesson ul,.lesson ol{padding-left:1.3rem;margin:0 0 1em}
.lesson li{margin-bottom:.35em}
.box{border-radius:12px;padding:1rem 1.2rem;margin:1.3rem 0;border-left:6px solid}
.box > :last-child{margin-bottom:0}
.box .bt{font-family:var(--display);font-weight:700;display:block;margin-bottom:.3rem}
.idea{background:var(--yolk-soft);border-color:var(--yolk)}
.granja{background:var(--leaf-soft);border-color:var(--leaf)}
.ojo{background:var(--warn-soft);border-color:var(--warn)}
.tbl{overflow-x:auto;margin:1.2rem 0}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:480px}
th,td{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:700;background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.timeline{list-style:none;padding:0!important;border-left:3px solid var(--yolk);margin-left:.4rem!important}
.timeline li{padding-left:1rem;position:relative;margin-bottom:.8em!important}
.timeline li::before{content:"";position:absolute;left:-9px;top:.55em;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--yolk)}
.timeline b{font-family:var(--display)}
.lesson-foot{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin:2rem 0 2.5rem;padding-top:1rem;border-top:1px solid var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.3rem 1.4rem;margin:2rem 0}
.panel h3{margin-top:0}
.tasks label{display:flex;gap:.7rem;align-items:flex-start;padding:.35rem 0;cursor:pointer}
.tasks input{margin-top:.45rem;width:18px;height:18px;accent-color:var(--leaf);flex:none}
.q{margin-bottom:1.4rem}
.q p{font-weight:600;margin-bottom:.5rem}
.q .opts{display:grid;gap:.4rem}
.q .opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem;color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45}
.q .opt:hover:not(:disabled){border-color:var(--shell)}
.q .opt.ok{background:var(--leaf-soft);border-color:var(--leaf)}
.q .opt.bad{background:var(--warn-soft);border-color:var(--warn)}
.q .fb{font-size:.95rem;margin-top:.5rem;color:var(--muted)}
.q .fb b{color:var(--ink)}
.score{font-family:var(--display);font-weight:700}

/* Calculadora */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.6rem;align-items:start}
.fields{display:grid;gap:.75rem}
.field label{display:block;font-family:var(--display);font-size:.9rem;font-weight:700}
.field small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-bottom:.25rem}
.field input{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.results{position:sticky;top:1rem}
.results .res{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px dashed var(--line);padding:.4rem 0;font-size:.97rem}
.results .res b{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.results .res.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:.5rem;padding-top:.7rem;font-size:1.1rem}
.pos{color:var(--leaf)} .neg{color:var(--warn)}
.verdict{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;font-size:.95rem}
.presets button{margin:0 .4rem .5rem 0}

/* Plan */
.plan-sec{margin-bottom:1.6rem}
.plan-sec textarea{width:100%;min-height:110px;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:1rem;line-height:1.55;resize:vertical}
.plan-sec label{font-family:var(--display);font-weight:700;display:block}
.plan-sec small{display:block;color:var(--muted);margin-bottom:.4rem;font-size:.9rem;line-height:1.45}
.saved{font-family:var(--display);font-size:.85rem;color:var(--leaf)}
#planPreview{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.5rem 1.7rem;margin-top:1.5rem}
#planPreview h4{margin-top:1.4em}
#planPreview .empty{color:var(--muted);font-style:italic}
dl.gloss dt{font-family:var(--display);font-weight:700;margin-top:1rem}
dl.gloss dd{margin:0 0 0 0}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{min-width:0}
  aside{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:20;transform:translateX(-105%);transition:transform .25s ease;height:100%;padding-top:calc(1.4rem + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}

  .topbar-mg .menu-toggle{position:static!important;margin:0!important}
  .menu-toggle{display:inline-flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:.8rem 1rem 0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.4rem 1rem;font-family:var(--display);font-weight:700}
  main{padding-top:1.2rem}
  .hero{grid-template-columns:1fr}
  .hero > div:last-child{order:-1;display:flex;align-items:center;gap:.8rem}
  .hero > div:last-child p{margin:0!important}
  .hero-egg{width:44px;height:56px}
  .calc{grid-template-columns:1fr}
  .results{position:static}
  .mod-head .bignum{font-size:3.2rem}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
@media print{
  aside,.menu-toggle,.no-print{display:none!important}
  .app{display:block} main{padding:0;max-width:none}
  body{background:#fff;color:#000}
  #planPreview{border:0;padding:0}
}

<script>
const MODULES = [
{
id:"m1", num:1, title:"El mercado del huevo y tus oportunidades",
src:"Planes de Negocios, curso 1 · Gestión de Negocios Avícolas, curso 1",
intro:"Antes de comprar una sola gallina, necesitas entender dónde vas a jugar: cómo se mueve el mercado, quién compra, quién ya vende y qué hueco puedes llenar tú.",
lessons:[
{t:"Panorama mundial y del Perú", html:`
<h3>El huevo en el mundo</h3>
<p>El huevo es una de las proteínas animales más baratas y consumidas del planeta. Los grandes productores (China, Estados Unidos, India, la Unión Europea, Brasil y México) marcan tendencias que tarde o temprano llegan al Perú. Tres tendencias importan para ti:</p>
<ul>
<li><b>El costo del alimento manda.</b> Entre 60% y 70% del costo de producir un huevo es alimento, y el alimento se hace sobre todo con maíz amarillo duro y torta de soya, cuyos precios se fijan en mercados internacionales.</li>
<li><b>La influenza aviar mueve precios.</b> Cuando un brote obliga a sacrificar millones de aves en un país, el precio del huevo sube allí y, por arrastre, en la región.</li>
<li><b>El consumidor pide bienestar animal.</b> Crecen los huevos "libres de jaula", "de pastoreo" y "de campo", que se venden más caros.</li>
</ul>
<h3>El huevo en el Perú</h3>
<p>En el Perú, el pollo y el huevo son la base de la proteína animal que come la población; SENASA estima que juntos representan alrededor del 70%. Eso significa demanda estable todo el año, pero también un mercado muy competido y sensible al precio.</p>
<ul>
<li>El Perú importa la mayor parte del maíz amarillo duro que usa para alimento balanceado, así que <b>el tipo de cambio y el precio internacional del maíz afectan directamente tu costo</b>.</li>
<li>La producción se concentra en la costa (el norte chico de Lima, Ica, La Libertad y Arequipa), donde están las grandes granjas tecnificadas.</li>
<li>En el país se prefiere el <b>huevo rosado</b> (cáscara marrón), por eso la mayoría de granjas usa líneas marrones como Hy-Line Brown, Lohmann Brown, Isa Brown o Babcock Brown.</li>
<li>Los precios se publican: MIDAGRI (a través del SISAP) reporta a diario precios mayoristas y minoristas del huevo en Lima. Por ejemplo, en marzo de 2026 el huevo rosado estaba en unos S/ 6.45 por kg en el Mercado de Productores de Santa Anita, y en julio de 2026 el precio minorista en Lima rondaba S/ 7.8 por kg.</li>
</ul>
<div class="box ojo"><span class="bt">Contexto actual (2026)</span><p>En julio de 2026 SENASA declaró emergencia sanitaria preventiva nacional por 90 días tras detectar influenza aviar H5N1 en aves de corral de Cañete y Carabayllo (Lima). Mientras esté vigente hay restricciones para movilizar aves y está prohibido hacer ferias avícolas. Antes de comprar tus aves, confirma en la web de SENASA si la medida sigue activa o se amplió.</p></div>
<div class="box idea"><span class="bt">Idea clave</span><p>El huevo común es un producto "commodity": todos venden casi lo mismo y gana quien produce más barato. Una granja pequeña casi nunca gana esa carrera, así que tu ventaja tendrá que venir de otro lado: frescura, cercanía, servicio o diferenciación.</p></div>
`},
{t:"Segmentación y competencia", html:`
<h3>¿Quién compra huevos?</h3>
<p>Segmentar es dividir el mercado en grupos con necesidades parecidas. Para una granja pequeña, estos son los segmentos más realistas:</p>
<div class="tbl"><table>
<tr><th>Segmento</th><th>Qué valora</th><th>Cómo compra</th><th>Qué exige de ti</th></tr>
<tr><td>Familias del barrio</td><td>Frescura, precio justo, confianza</td><td>Por plancha de 30 o por kilo, cada semana</td><td>Constancia y buen trato</td></tr>
<tr><td>Bodegas y minimarkets</td><td>Precio, que no lleguen rotos, reposición puntual</td><td>Varias planchas, 1 o 2 veces por semana</td><td>Precio competitivo y a veces crédito corto</td></tr>
<tr><td>Panaderías, pastelerías, restaurantes</td><td>Volumen estable y precio</td><td>Pedidos fijos</td><td>No fallar nunca en la entrega; comprobante</td></tr>
<tr><td>Consumidor "premium"</td><td>Huevo de campo o pastoreo, bienestar animal, sabor</td><td>Delivery, tiendas saludables, ferias</td><td>Historia creíble y calidad constante</td></tr>
<tr><td>Mayoristas y acopiadores</td><td>Volumen y precio bajo</td><td>Por kilo o por caja</td><td>Mucha producción; te pagan el precio más bajo</td></tr>
</table></div>
<h3>¿Contra quién compites?</h3>
<ul>
<li><b>Grandes granjas industriales:</b> producen a costo muy bajo y abastecen mercados y supermercados.</li>
<li><b>Distribuidores de mercado:</b> revenden huevo de granjas grandes con margen pequeño.</li>
<li><b>Otros pequeños productores y huevos "de chacra":</b> compiten en cercanía y confianza.</li>
</ul>
<p>Una forma sencilla de analizar la competencia es una tabla con 4 o 5 competidores y estas columnas: precio por plancha, tipo de huevo, dónde venden, cada cuánto reponen y qué dicen sus clientes. Complétala con visitas reales.</p>
<h3>El FODA de tu idea</h3>
<p>Resume lo aprendido en cuatro cuadros: <b>Fortalezas</b> (lo que tú haces bien), <b>Debilidades</b> (lo que te falta), <b>Oportunidades</b> (lo que pasa afuera y te favorece) y <b>Amenazas</b> (lo que pasa afuera y te puede dañar, como la influenza aviar o la subida del maíz).</p>
<div class="box granja"><span class="bt">En tu granja</span><p>Con 200 a 500 gallinas no produces para un supermercado, pero sí para 40 a 120 familias o para 3 a 8 bodegas y panaderías. Elige uno o dos segmentos principales, no todos.</p></div>
`},
{t:"Investigación de mercado y consumidor", html:`
<h3>Investigar sin gastar mucho</h3>
<p>No necesitas una encuestadora. Necesitas datos reales de tu zona. Un plan de dos semanas:</p>
<ol>
<li><b>Precios:</b> visita 3 mercados y 10 bodegas; anota precio por kilo, por plancha y por unidad, y el color y tamaño del huevo. Compáralo con los precios de referencia de MIDAGRI.</li>
<li><b>Clientes de volumen:</b> conversa con 5 panaderías o restaurantes. Pregunta cuántos huevos usan por semana, a quién le compran, qué les molesta de su proveedor actual y cuánto pagan.</li>
<li><b>Familias:</b> haz 30 encuestas cortas (en persona o por WhatsApp).</li>
<li><b>Prueba real:</b> si puedes, compra 10 planchas a un productor, véndelas con tu propuesta y mide cuántos repiten.</li>
</ol>
<h3>Preguntas útiles para la encuesta</h3>
<ul>
<li>¿Cuántos huevos consume tu hogar por semana?</li>
<li>¿Dónde los compras y por qué ahí?</li>
<li>¿Qué es lo más importante: precio, frescura, tamaño, que sea de campo, que te lo lleven a casa?</li>
<li>¿Pagarías más por huevos con fecha de postura o de gallinas de pastoreo? ¿Cuánto más por plancha?</li>
<li>¿Te gustaría recibirlos en casa cada semana?</li>
</ul>
<h3>Cómo decide el consumidor</h3>
<p>La compra del huevo es rutinaria: se compra rápido y sin pensar mucho. Para que alguien cambie de proveedor necesita una razón clara (más fresco, más cómodo, mejor sabor, mejor trato) y confianza. La confianza se gana con constancia: el mismo día, la misma calidad, sin huevos rotos ni malos.</p>
<div class="box idea"><span class="bt">Idea clave</span><p>Lo que la gente dice que pagaría no siempre es lo que paga. Da más peso a lo que observas (precios reales, pruebas de venta) que a lo que responden en una encuesta.</p></div>
`},
{t:"Identificar oportunidades", html:`
<h3>De un problema a una oportunidad</h3>
<p>Una oportunidad de negocio aparece cuando hay una necesidad mal atendida que tú puedes cubrir con ganancia. Ejemplos típicos en huevos:</p>
<ul>
<li>Familias que quieren huevo fresco y no confían en el del mercado → <b>huevo con fecha de postura y reparto semanal</b>.</li>
<li>Panaderías con proveedores que fallan → <b>abastecimiento puntual con precio pactado</b>.</li>
<li>Personas que buscan comida más natural → <b>huevo de gallinas en pastoreo</b>.</li>
<li>Zonas alejadas de los centros de distribución → <b>productor local con menos flete</b>.</li>
</ul>
<h3>Cómo elegir la mejor</h3>
<p>Califica cada idea del 1 al 5 en estos criterios y suma:</p>
<div class="tbl"><table>
<tr><th>Criterio</th><th>Pregunta</th></tr>
<tr><td>Demanda</td><td>¿Hay suficientes clientes cerca y ya confirmé interés?</td></tr>
<tr><td>Margen</td><td>¿El precio que pagan cubre mi costo con holgura?</td></tr>
<tr><td>Inversión</td><td>¿Puedo empezar con lo que tengo o consigo?</td></tr>
<tr><td>Riesgo</td><td>¿Qué tan grave es si sale mal?</td></tr>
<tr><td>Mi capacidad</td><td>¿Tengo el tiempo, espacio y conocimientos?</td></tr>
</table></div>
<h3>Escribe tu propuesta en una frase</h3>
<p>Usa esta fórmula: <i>"Ofrezco [producto] a [cliente] que necesita [necesidad], y me diferencio porque [razón]."</i></p>
<div class="box granja"><span class="bt">Ejemplo</span><p>"Ofrezco huevos rosados de gallinas criadas en piso, con fecha de postura, a familias de mi distrito que quieren huevo fresco sin ir al mercado, y me diferencio porque los llevo a su casa cada sábado."</p></div>
`}
],

{
id:"m2", num:2, title:"Marketing y marca para tus huevos",
src:"Planes de Negocios, curso 2 · Gestión de Negocios Avícolas, curso 2",
intro:"Un huevo se parece mucho a otro. El marketing es lo que hace que te elijan a ti, y la marca es lo que hace que vuelvan.",
lessons:[
{t:"Estrategias de marketing", html:`
<h3>Las 4P aplicadas al huevo</h3>
<div class="tbl"><table>
<tr><th>P</th><th>Qué decides</th><th>Ejemplo</th></tr>
<tr><td>Producto</td><td>Color, tamaño, frescura, presentación</td><td>Huevo rosado grande, en plancha de 30 o bandeja de 15 con etiqueta y fecha</td></tr>
<tr><td>Precio</td><td>Cuánto cobras y cómo (kg, plancha, unidad)</td><td>Plancha de 30 a un precio fijo durante el mes</td></tr>
<tr><td>Plaza</td><td>Dónde y cómo llega al cliente</td><td>Reparto los sábados y venta en la granja</td></tr>
<tr><td>Promoción</td><td>Cómo te conocen</td><td>WhatsApp, volantes en bodegas, recomendaciones</td></tr>
</table></div>
<h3>Cómo poner el precio</h3>
<ol>
<li><b>Piso:</b> tu costo por huevo (lo calcularás en el módulo 6). Nunca vendas por debajo de forma sostenida.</li>
<li><b>Techo:</b> lo que cobra la competencia por un producto parecido.</li>
<li><b>Tu precio</b> va entre ambos, según tu diferenciación. Si vendes huevo común, cerca del mercado. Si vendes huevo de pastoreo con reparto, puedes ir claramente por encima.</li>
</ol>
<p>Dos estrategias clásicas: <b>precio de penetración</b> (entras un poco más barato para ganar clientes y luego ajustas) y <b>precio premium</b> (cobras más porque ofreces algo distinto). En huevo, bajar precio es fácil y subirlo después cuesta; piensa bien antes.</p>
<div class="box idea"><span class="bt">Idea clave</span><p>Vender por plancha a precio fijo da tranquilidad al cliente. Vender por kilo te protege cuando el tamaño del huevo varía. Muchas granjas pequeñas usan plancha para familias y kilo para negocios.</p></div>
`},
{t:"Marca y diferenciación", html:`
<h3>Tu marca es una promesa</h3>
<p>Una marca no es solo un logo: es lo que el cliente espera recibir cada vez. Para construirla necesitas:</p>
<ul>
<li><b>Nombre</b> corto, fácil de decir y recordar, relacionado con tu zona o tu historia.</li>
<li><b>Promesa</b> clara: "fresco de esta semana", "de gallinas que caminan", "puntual cada sábado".</li>
<li><b>Identidad visual sencilla:</b> un logo, un color y una etiqueta. Un sticker en cada bandeja ya es marca.</li>
<li><b>Consistencia:</b> la promesa se cumple siempre.</li>
</ul>
<h3>Formas de diferenciarte</h3>
<ul>
<li><b>Frescura comprobable:</b> fecha de postura en la etiqueta.</li>
<li><b>Sistema de crianza:</b> piso o pastoreo en lugar de jaula (y contarlo con fotos reales).</li>
<li><b>Servicio:</b> reparto, suscripción semanal, reposición sin discusión si llega un huevo roto.</li>
<li><b>Presentación:</b> bandejas de 15 o de 6 para quien compra poco.</li>
<li><b>Origen:</b> "producido en [tu distrito]".</li>
</ul>
<div class="box ojo"><span class="bt">Cuidado con lo que prometes</span><p>No uses la palabra "orgánico" si no tienes certificación orgánica (en el Perú la autoridad en producción orgánica es SENASA). Tampoco digas "sin antibióticos" o "sin químicos" si no puedes demostrarlo. Una promesa falsa destruye la confianza y puede traerte sanciones.</p></div>
`},
{t:"Redes sociales", html:`
<h3>WhatsApp Business: tu herramienta principal</h3>
<ul>
<li><b>Catálogo</b> con tus presentaciones y precios.</li>
<li><b>Listas de difusión</b> para avisar el día de reparto (solo llegan a quien te tiene agendado).</li>
<li><b>Estados</b> con fotos de la granja, del recojo de huevos o de una receta.</li>
<li><b>Respuestas rápidas</b> para precios, zonas de reparto y formas de pago (Yape, Plin, efectivo).</li>
</ul>
<h3>Facebook, Instagram y TikTok</h3>
<p>Sirven para que nuevos clientes te descubran. Ideas de contenido que funcionan:</p>
<ul>
<li>"Un día en la granja": recolección, alimentación, limpieza.</li>
<li>Recetas sencillas con huevo.</li>
<li>Comparación de un huevo fresco con uno viejo (la yema firme y la clara espesa se notan).</li>
<li>Testimonios de clientes.</li>
</ul>
<p>Los grupos de Facebook del barrio y Marketplace suelen traer los primeros pedidos.</p>
<h3>Un calendario simple</h3>
<p>3 publicaciones por semana bastan: lunes (granja), miércoles (receta o consejo), viernes (recordatorio de pedido para el sábado). Mide lo que importa: pedidos nuevos y clientes que repiten, no solo "me gusta".</p>
<div class="box ojo"><span class="bt">Bioseguridad también en redes</span><p>No invites visitas a la granja para grabar contenido y no muestres personas dentro del galpón sin ropa de protección. Tus aves y tu imagen lo agradecerán.</p></div>
`},
{t:"Medios tradicionales y digitales", html:`
<h3>Lo tradicional sigue funcionando en lo local</h3>
<ul>
<li><b>Volantes y afiches</b> en bodegas aliadas, con tu número de WhatsApp y un código QR.</li>
<li><b>Degustaciones</b> o regalar 6 huevos de prueba a clientes potenciales.</li>
<li><b>Radio o altoparlante local</b> en provincias.</li>
<li><b>Ferias de productores</b> para vender huevo (ojo: durante la emergencia sanitaria están prohibidas las ferias de aves vivas; confirma las reglas vigentes).</li>
<li><b>Recomendación boca a boca:</b> premia al cliente que te trae otro cliente.</li>
</ul>
<h3>Lo digital básico</h3>
<ul>
<li><b>Perfil de empresa en Google Maps</b>: gratis y aparece cuando buscan "huevos cerca de mí".</li>
<li><b>Link directo a WhatsApp</b> en todas tus redes.</li>
</ul>
<div class="box idea"><span class="bt">Idea clave</span><p>Combina: el volante en la bodega lleva a tu WhatsApp, WhatsApp cierra la venta y la buena experiencia genera recomendaciones. No necesitas estar en todos los medios, solo en los que usan tus clientes.</p></div>
`},
{t:"Relaciones públicas", html:`
<h3>Relaciones con tu entorno</h3>
<p>Las relaciones públicas son cuidar la reputación con todos los que te rodean, no solo con los clientes:</p>
<ul>
<li><b>Vecinos:</b> una granja mal manejada huele, atrae moscas y roedores. Controla la gallinaza y conversa con ellos antes de que haya quejas.</li>
<li><b>Municipalidad y SENASA:</b> estar en regla y tener buena relación te facilita permisos y apoyo.</li>
<li><b>Otros productores y asociaciones:</b> comparten proveedores, precios y alertas sanitarias.</li>
<li><b>Comunidad:</b> donar huevos a un comedor u olla común genera buena voluntad real.</li>
</ul>
<h3>Plan ante una crisis</h3>
<p>Ten pensado qué hacer si algo sale mal:</p>
<ol>
<li><b>Reclamo por un huevo malo:</b> reemplaza sin discutir, agradece el aviso y revisa tu proceso.</li>
<li><b>Aves enfermas o mortalidad inusual:</b> aísla, llama al veterinario y notifica a SENASA. No vendas aves enfermas ni ocultes el problema.</li>
<li><b>Comunicación:</b> di la verdad, explica qué estás haciendo y cuándo se resuelve.</li>
</ol>
`}
],

id:"m3", num:3, title:"Comercialización, distribución y negociación",
src:"Planes de Negocios, curso 3 · Gestión de Negocios Avícolas, curso 2",
intro:"Producir es la mitad del negocio. La otra mitad es que el huevo llegue entero, fresco y a tiempo a quien paga por él.",
lessons:[
{t:"Canales de distribución", html:`
<h3>Los canales posibles</h3>
<div class="tbl"><table>
<tr><th>Canal</th><th>Precio que recibes</th><th>Volumen</th><th>Exigencia</th></tr>
<tr><td>Venta directa (granja o reparto)</td><td>Alto</td><td>Bajo a medio</td><td>Tiempo tuyo en ventas y reparto</td></tr>
<tr><td>Bodegas y minimarkets</td><td>Medio</td><td>Medio</td><td>Puntualidad; a veces crédito de 7 a 15 días</td></tr>
<tr><td>Panaderías y restaurantes</td><td>Medio</td><td>Medio a alto y estable</td><td>Nunca fallar; comprobante de pago</td></tr>
<tr><td>Mayorista o acopiador</td><td>Bajo</td><td>Alto</td><td>Poca, pero margen mínimo</td></tr>
<tr><td>Supermercados</td><td>Medio</td><td>Alto</td><td>Formalidad total, registro sanitario, crédito de 30 a 60 días</td></tr>
</table></div>
<p>Lo más sano para empezar es <b>mezclar 2 canales</b>: uno de buen precio (venta directa) y uno de volumen estable (panaderías o bodegas). Así no dependes de uno solo.</p>
<h3>La logística del huevo</h3>
<ul>
<li>El huevo es frágil: transpórtalo en planchas bien apiladas, sin golpes y a la sombra.</li>
<li>Guárdalo en un lugar fresco, ventilado y sin sol. Si alguna vez lo refrigeras, mantenlo en frío hasta la venta (el cambio de frío a calor hace que "sude" y se contamine más fácil).</li>
<li>Vende primero lo más antiguo (regla "lo primero que entra es lo primero que sale").</li>
<li>Planifica una ruta fija de reparto con días fijos: ahorras combustible y el cliente sabe cuándo llegas.</li>
</ul>
`},
{t:"Clientes clave", html:`
<h3>La regla 80/20</h3>
<p>Casi siempre, pocos clientes (el 20%) compran la mayor parte (el 80%). Identifícalos y cuídalos de forma especial.</p>
<h3>Cómo gestionarlos</h3>
<ul>
<li><b>Ficha de cliente:</b> nombre, contacto, cuánto compra, qué día, cómo paga, qué le importa.</li>
<li><b>Acuerdo claro:</b> cantidad semanal, precio, día de entrega y forma de pago. Confírmalo por escrito, aunque sea por WhatsApp.</li>
<li><b>Servicio postventa:</b> pregunta cada cierto tiempo cómo le va con el producto.</li>
<li><b>Reposición sin drama</b> de huevos rotos o defectuosos.</li>
<li><b>Cobranza ordenada:</b> si das crédito, pon límite de monto y plazo. Un cliente que no paga es peor que no tener cliente.</li>
</ul>
<div class="box ojo"><span class="bt">Riesgo de concentración</span><p>Si un solo cliente te compra más del 40% de la producción, estás en riesgo: si se va, te quedas con huevos que no puedes vender. Busca activamente otros clientes.</p></div>
`},
{t:"Normativa y exportación", html:`
<h3>Primero, estar en regla en el mercado local</h3>
<ul>
<li><b>SUNAT:</b> RUC y comprobantes electrónicos (boleta o factura). Los negocios y panaderías te pedirán factura.</li>
<li><b>SENASA:</b> las granjas avícolas deben registrarse ante SENASA según el Reglamento del Sistema Sanitario Avícola; además SENASA vela por la inocuidad de los alimentos agropecuarios primarios como el huevo. Pregunta en la oficina de tu región qué requisitos aplican a tu tamaño de granja.</li>
<li><b>Municipalidad:</b> verifica que la zonificación permita crianza de animales y tramita la licencia que corresponda.</li>
<li><b>Movilización de aves:</b> el traslado de aves y sus productos necesita el certificado sanitario que exija la autoridad, sobre todo durante emergencias sanitarias.</li>
</ul>
<h3>¿Y exportar?</h3>
<p>Exportar productos avícolas exige mucho más:</p>
<ul>
<li>Establecimiento registrado y certificado por SENASA.</li>
<li>Cumplir los requisitos sanitarios del país de destino (cada país pone los suyos).</li>
<li>Trazabilidad completa: saber de qué lote viene cada huevo.</li>
<li>Estar en zonas o compartimentos libres de enfermedades reconocidos en acuerdos sanitarios.</li>
<li>Volumen constante y precios competitivos a nivel internacional.</li>
</ul>
<div class="box idea"><span class="bt">Idea clave</span><p>Para una granja pequeña, exportar no es el primer paso. El camino realista es: mercado local → formalización completa → abastecer a procesadoras o exportadores → y recién después pensar en exportar directamente o en asociación con otros productores.</p></div>
`},
{t:"Técnicas de negociación", html:`
<h3>Prepárate antes de sentarte</h3>
<ol>
<li><b>Conoce tu piso:</b> tu costo por huevo más un margen mínimo. Por debajo de eso, dices que no.</li>
<li><b>Conoce tu alternativa:</b> si este cliente no acepta, ¿a quién más le vendes? Mientras mejor sea tu alternativa, más fuerte negocias.</li>
<li><b>Averigua qué le importa al otro:</b> a veces no es el precio, sino la puntualidad o el crédito.</li>
</ol>
<h3>Durante la negociación</h3>
<ul>
<li>Escucha más de lo que hablas.</li>
<li><b>Nunca concedas gratis:</b> si bajas el precio, pide algo a cambio (más volumen, pago al contado, contrato de 3 meses).</li>
<li>Busca que ambos ganen; un cliente que se siente estafado no dura.</li>
<li>Cierra por escrito: cantidad, precio, día, forma de pago y qué pasa si algo falla.</li>
</ul>
<div class="box granja"><span class="bt">Ejemplo con una panadería</span><p><i>Panadería:</i> "Te compro 10 planchas semanales si me bajas 2 soles por plancha."<br><i>Tú:</i> "Puedo bajar 1 sol si me pagas al contado en cada entrega y quedamos por 3 meses. Así yo aseguro la producción para ti."</p></div>
`}
],

id:"m4", num:4, title:"La granja por dentro: producción y sanidad",
src:"Gestión de Negocios Avícolas, curso 3",
intro:"Este es el corazón técnico: cómo vive y produce una gallina ponedora, qué instalaciones necesita y cómo protegerla de enfermedades. Las cifras son referenciales; la guía de manejo de tu línea genética y tu veterinario tienen la última palabra.",
lessons:[
{t:"La cadena de valor", html:`
<h3>Del proveedor al cliente</h3>
<p>La cadena de valor muestra cada paso donde se crea (o se pierde) valor:</p>
<ol>
<li><b>Proveedores:</b> pollitas, alimento balanceado, vacunas, equipos, empaques.</li>
<li><b>Cría y recría:</b> de pollita de un día a polla lista para poner (si la haces tú).</li>
<li><b>Postura:</b> la gallina produce huevos durante más de un año.</li>
<li><b>Recolección y clasificación:</b> recoger, limpiar en seco, separar rotos y sucios, clasificar por tamaño.</li>
<li><b>Empaque y almacenamiento:</b> planchas, bandejas, etiquetas.</li>
<li><b>Venta y distribución.</b></li>
<li><b>Descarte:</b> al final del ciclo, las gallinas se venden como "gallina de saca". La gallinaza (estiércol) puede venderse como abono.</li>
</ol>
<div class="box idea"><span class="bt">Idea clave</span><p>Las grandes granjas ganan por escala en los pasos 1 a 3. Una granja pequeña puede ganar en los pasos 4 a 7: mejor clasificación, mejor presentación, venta directa y aprovechamiento de la gallinaza.</p></div>
`},
{t:"El ciclo de la ponedora", html:`
<h3>¿Pollita de un día o polla recriada?</h3>
<p>Puedes comprar pollitas bebé (de un día) y criarlas tú, o comprar pollas recriadas de 16 a 18 semanas, ya vacunadas y a punto de poner. Para empezar se recomienda la <b>polla recriada</b>: cuesta más por ave, pero evitas la etapa más delicada, empiezas a vender en pocas semanas y recibes el historial de vacunas.</p>
<h3>Línea de tiempo (referencial, líneas marrones)</h3>
<ul class="timeline">
<li><b>Semanas 0 a 6: cría.</b> Calor, cama limpia, alimento de inicio. Etapa de mayor mortalidad.</li>
<li><b>Semanas 7 a 16: recría.</b> Se forma el esqueleto y se busca un peso uniforme. No se aumenta la luz.</li>
<li><b>Semanas 16 a 18: traslado</b> al galpón de postura y cambio a alimento de prepostura.</li>
<li><b>Semanas 18 a 21: inicio de postura.</b> Se aumenta la luz poco a poco hasta unas 16 horas diarias.</li>
<li><b>Semanas 25 a 32: pico de postura.</b> Con buen manejo, más de 90 de cada 100 gallinas ponen cada día.</li>
<li><b>Semanas 32 a 75/80: descenso gradual.</b> La postura baja poco a poco y el huevo es más grande.</li>
<li><b>Semana 75 a 80 en adelante: descarte.</b> Cuando la producción ya no cubre el costo del alimento, las gallinas se venden y entra un lote nuevo.</li>
</ul>
<h3>Datos que debes conocer</h3>
<ul>
<li>Una gallina de línea comercial bien manejada puede dar alrededor de 300 huevos o más en su ciclo principal.</li>
<li>Come entre 105 y 120 gramos de alimento al día y toma cerca del doble en agua (más con calor).</li>
<li>Necesita alrededor de 16 horas de luz al día durante la postura. <b>Nunca reduzcas las horas de luz</b> en postura: la producción cae.</li>
<li>El peso uniforme del lote al inicio de postura es clave para un buen pico.</li>
</ul>
<div class="box granja"><span class="bt">En tu granja</span><p>Trabaja por lotes de la misma edad ("todo dentro, todo fuera"). Mezclar gallinas de distintas edades complica el alimento, la luz, las vacunas y facilita contagios.</p></div>
`},
{t:"Instalaciones y equipos", html:`
<h3>Tres sistemas de crianza</h3>
<div class="tbl"><table>
<tr><th>Sistema</th><th>Ventajas</th><th>Desventajas</th></tr>
<tr><td>Jaulas</td><td>Más aves por m², huevo limpio, fácil control</td><td>Mayor inversión en jaulas; tendencia de consumo en contra</td></tr>
<tr><td>Piso con cama</td><td>Inversión moderada, bienestar mayor, huevo "libre de jaula"</td><td>Más huevos sucios o puestos fuera del nido; manejo de la cama</td></tr>
<tr><td>Pastoreo</td><td>Mejor precio de venta, gran historia de marca</td><td>Necesita terreno, más riesgo de contacto con aves silvestres, más mano de obra</td></tr>
</table></div>
<h3>Medidas de referencia para piso</h3>
<ul>
<li><b>Densidad:</b> unas 5 a 6 gallinas por m² de galpón (menos en zonas calurosas).</li>
<li><b>Nidos:</b> 1 nido por cada 4 a 5 gallinas, en zona oscura y tranquila.</li>
<li><b>Comederos:</b> que todas puedan comer a la vez; tolvas o comederos lineales.</li>
<li><b>Bebederos:</b> agua limpia siempre; los de niple o tipo campana reducen desperdicio y humedad.</li>
<li><b>Cama:</b> viruta o cascarilla de arroz seca, de 8 a 10 cm; retira la parte húmeda o apelmazada.</li>
<li><b>Perchas:</b> las gallinas descansan mejor en alto.</li>
</ul>
<h3>El galpón</h3>
<ul>
<li>En la costa, orientación de este a oeste para que el sol no entre directo en las horas de calor.</li>
<li>Buena ventilación, cortinas para regular viento y frío, techo que proteja del calor.</li>
<li><b>Malla que impida el ingreso de aves silvestres</b> y roedores (clave contra la influenza aviar).</li>
<li>Luz artificial con temporizador para completar las 16 horas.</li>
<li>Almacén aparte, seco y cerrado para el alimento; espacio para clasificar huevos.</li>
</ul>
`},
{t:"Alimentación y agua", html:`
<h3>Alimento por etapas</h3>
<p>La gallina necesita un alimento distinto en cada etapa: inicio, crecimiento, prepostura y postura (a veces postura fase 1 y fase 2). En postura el alimento lleva mucho calcio para formar la cáscara; parte del calcio en partículas gruesas mejora la calidad de la cáscara.</p>
<h3>¿Comprar o preparar el alimento?</h3>
<p>Al empezar, <b>compra alimento balanceado de una planta reconocida</b>. Preparar tu propia fórmula puede ahorrar dinero, pero requiere un nutricionista, buen control de insumos (el maíz con hongos es un peligro) y volumen para que valga la pena.</p>
<h3>Buenas prácticas</h3>
<ul>
<li>Llena comederos sin rebalsar: el alimento desperdiciado es dinero tirado.</li>
<li>Guarda los sacos sobre parihuelas, lejos de paredes húmedas y protegidos de roedores.</li>
<li>Usa primero el alimento más antiguo y no acumules más de 2 o 3 semanas.</li>
<li>Agua limpia y fresca todo el tiempo; lava los bebederos con frecuencia. Si la gallina no toma agua, no pone.</li>
<li>Pesa el alimento que das cada día: es tu dato más importante para controlar costos.</li>
</ul>
<div class="box ojo"><span class="bt">Calor</span><p>Con calor la gallina come menos y pone menos o con cáscara más delgada. Da agua fresca, sombra, ventilación y alimenta en las horas frescas.</p></div>
`},
{t:"Sanidad y bioseguridad", html:`
<h3>Bioseguridad: evitar que la enfermedad entre</h3>
<p>Es más barato prevenir que curar. Reglas básicas:</p>
<ul>
<li>Cerco perimetral y una sola entrada controlada.</li>
<li>Pediluvio (bandeja con desinfectante) en la entrada del galpón y lavado de manos.</li>
<li>Ropa y botas exclusivas para la granja.</li>
<li>Pocas visitas, y con registro. Nadie que haya estado en otra granja o en un mercado de aves ese día.</li>
<li>No tener aves de traspatio, patos o gallos de pelea cerca del galpón.</li>
<li>Malla contra aves silvestres; no dejar alimento ni agua expuestos que las atraigan.</li>
<li>Control permanente de roedores e insectos.</li>
<li>Retirar y disponer correctamente las aves muertas cada día.</li>
<li>Limpieza y desinfección total del galpón entre lotes, con un tiempo de vacío sanitario.</li>
</ul>
<h3>Vacunación</h3>
<p>El programa de vacunas depende de tu zona y lo define un <b>médico veterinario</b>. En ponedoras suelen incluir enfermedades como Marek, Newcastle, bronquitis infecciosa, Gumboro, viruela aviar y otras según el riesgo local. Si compras pollas recriadas, exige su registro de vacunación.</p>
<h3>Señales de alarma</h3>
<ul>
<li>Muertes repentinas o más de lo normal.</li>
<li>Caída brusca de la postura o del consumo de agua o alimento.</li>
<li>Crestas moradas, hinchazón en cabeza, dificultad para respirar, diarrea verde.</li>
<li>Huevos deformes o sin cáscara en cantidad.</li>
</ul>
<div class="box ojo"><span class="bt">Ante sospecha de influenza aviar</span><p>Aísla el galpón, no muevas ni vendas aves, y notifica de inmediato a SENASA. La autoridad tiene habilitado el teléfono 946 922 469 y el correo reporta.peru@senasa.gob.pe (verifica que sigan vigentes). Notificar es obligatorio.</p></div>
<h3>Medicamentos</h3>
<p>Usa antibióticos solo con receta del veterinario y respeta el <b>periodo de retiro</b>: durante ese tiempo los huevos no se deben vender para consumo. Es una norma de inocuidad y de ética con tus clientes.</p>
`},
{t:"El huevo: recojo, calidad y registros", html:`
<h3>Recolección y clasificación</h3>
<ul>
<li>Recoge 3 o 4 veces al día: menos huevos rotos, sucios o empollados.</li>
<li>Separa: huevos buenos, sucios, rotos o fisurados, deformes y muy pequeños.</li>
<li>Limpia en seco (lija fina o paño). Lavar el huevo con agua puede meter bacterias por los poros de la cáscara.</li>
<li>Clasifica por tamaño si vendes a clientes que lo valoran; los grandes se pueden vender mejor.</li>
<li>Revisa a contraluz (ovoscopio) para detectar fisuras o manchas internas.</li>
<li>Los huevos rotos no se venden como huevo de mesa.</li>
</ul>
<h3>Registros diarios</h3>
<p>Lo que no se anota no se puede mejorar. Cada día registra:</p>
<div class="tbl"><table>
<tr><th>Dato</th><th>Para qué sirve</th></tr>
<tr><td>Aves vivas y muertas</td><td>Detectar problemas sanitarios a tiempo</td></tr>
<tr><td>Huevos totales, buenos, rotos y sucios</td><td>Calcular % de postura y mermas</td></tr>
<tr><td>Kilos de alimento dados</td><td>Controlar tu mayor costo</td></tr>
<tr><td>Agua consumida (si puedes medirla)</td><td>Es la primera señal de enfermedad</td></tr>
<tr><td>Temperatura máxima y mínima</td><td>Explicar bajas de producción</td></tr>
<tr><td>Vacunas, tratamientos y visitas</td><td>Trazabilidad y bioseguridad</td></tr>
</table></div>
<p>Basta un cuaderno o una hoja de cálculo. En el módulo 6 convertirás estos datos en indicadores.</p>
`},
{t:"Proveedores y logística", html:`
<h3>Elige bien a tus proveedores</h3>
<ul>
<li><b>Pollitas o pollas:</b> de incubadoras o recriadores formales, con registro en SENASA, línea genética conocida y registro de vacunas. Pide referencias de otros clientes.</li>
<li><b>Alimento:</b> planta con buena reputación, fórmula por etapa y entrega puntual.</li>
<li><b>Vacunas y medicinas:</b> en tiendas veterinarias autorizadas y con cadena de frío.</li>
<li><b>Empaques:</b> planchas de pulpa, bandejas, etiquetas.</li>
</ul>
<h3>Planifica tus compras</h3>
<ul>
<li>Calcula el consumo semanal de alimento y compra con anticipación para no quedarte sin stock.</li>
<li>Ten al menos 2 proveedores posibles de cada insumo crítico.</li>
<li>Programa la llegada del siguiente lote de aves varias semanas antes de descartar el actual, dejando tiempo para limpiar y desinfectar.</li>
<li>Negocia descuentos por volumen o pago puntual.</li>
</ul>
<div class="box granja"><span class="bt">Ejemplo de consumo</span><p>300 gallinas × 0.11 kg al día = 33 kg diarios, es decir unos 231 kg por semana (casi 5 sacos de 50 kg). Al mes, cerca de 1 tonelada de alimento.</p></div>
`}
],

id:"m5", num:5, title:"Innovación y sostenibilidad",
src:"Planes de Negocios, curso 4",
intro:"Innovar no siempre es comprar máquinas caras. En una granja pequeña, innovar es usar herramientas simples para producir mejor, gastar menos y cuidar tu entorno.",
lessons:[
{t:"Tecnología al alcance", html:`
<h3>Lo que usan las grandes granjas</h3>
<p>Galpones de ambiente controlado, jaulas automatizadas, bandas que recogen el huevo, clasificadoras automáticas, sensores y software de gestión. Te sirve conocerlo para entender por qué producen tan barato.</p>
<h3>Lo que puedes usar tú desde el inicio</h3>
<ul>
<li><b>Registros digitales:</b> una hoja de cálculo o app en el celular con tus datos diarios y gráficos de postura.</li>
<li><b>Termohigrómetro</b> económico para medir temperatura y humedad del galpón.</li>
<li><b>Temporizador y focos LED</b> para el programa de luz: ahorran electricidad.</li>
<li><b>Bebederos de niple y comederos tipo tolva:</b> menos desperdicio y menos mano de obra.</li>
<li><b>Balanza</b> para pesar alimento, huevos y una muestra de aves.</li>
<li><b>Ovoscopio</b> (puede ser una linterna potente) para revisar huevos.</li>
<li><b>Paneles solares</b> para luz y bombeo de agua donde la electricidad es cara o inestable.</li>
<li><b>Yape, Plin y WhatsApp Business</b> para cobrar y vender sin complicaciones.</li>
</ul>
<div class="box idea"><span class="bt">Idea clave</span><p>Antes de invertir en una tecnología, pregúntate qué indicador va a mejorar (menos desperdicio de alimento, más postura, menos huevos rotos) y en cuánto tiempo recuperas lo que cuesta.</p></div>
`},
{t:"Responsabilidad social", html:`
<h3>La RSC también es para los pequeños</h3>
<p>La responsabilidad social corporativa es hacer negocio cuidando a las personas y al entorno. En tu escala significa:</p>
<ul>
<li><b>Con tus trabajadores:</b> pago justo y puntual, equipos de protección, capacitación.</li>
<li><b>Con tus aves:</b> bienestar animal. Una referencia útil son las "cinco libertades": libres de hambre y sed, de incomodidad, de dolor y enfermedad, de miedo y estrés, y libres para expresar su comportamiento natural.</li>
<li><b>Con tus vecinos:</b> sin olores fuertes, moscas ni roedores; diálogo abierto.</li>
<li><b>Con tus clientes:</b> huevo inocuo, promesas honestas.</li>
<li><b>Con tu comunidad:</b> empleo local, compras a proveedores de la zona, apoyo a comedores u ollas comunes con huevos de segunda que sean aptos para consumo.</li>
</ul>
<p>Además de ser correcto, esto construye marca y reduce conflictos que pueden cerrar tu granja.</p>
`},
{t:"Sostenibilidad en la cadena", html:`
<h3>Aprovecha la gallinaza</h3>
<p>Una gallina produce estiércol todos los días. Mal manejado es un problema (moscas, olores, contaminación); bien manejado es un ingreso:</p>
<ul>
<li><b>Compostaje:</b> mezcla gallinaza con cama y material seco, voltea periódicamente y deja que caliente y madure. El calor del compostaje reduce patógenos y moscas.</li>
<li><b>Venta como abono</b> a agricultores o viveros, o uso en tus propios cultivos.</li>
<li>Consulta si en tu zona hay reglas para transportar o usar gallinaza; hay restricciones sanitarias para su uso fresco.</li>
</ul>
<h3>Otras prácticas</h3>
<ul>
<li><b>Agua:</b> repara fugas, usa bebederos que no se derramen.</li>
<li><b>Alimento:</b> menos desperdicio es menos costo y menos impacto.</li>
<li><b>Empaques:</b> planchas de pulpa de cartón reciclable; pide a clientes frecuentes que devuelvan las planchas limpias para reutilizar (solo si están en buen estado e higiénicas).</li>
<li><b>Energía:</b> LED, luz natural bien aprovechada, energía solar.</li>
<li><b>Aves de descarte:</b> véndelas a canales formales para su consumo, no las abandones.</li>
</ul>
`},
{t:"Casos de estudio", html:`
<p>Estos son casos tipo, construidos para ilustrar decisiones reales que enfrentan granjas pequeñas.</p>
<h3>Caso A: el huevo de pastoreo con suscripción</h3>
<p>Una familia en un valle cercano a una ciudad cría 400 gallinas en un terreno cercado con rotación de potreros. Vende bandejas de 15 huevos con fecha de postura por suscripción semanal a 150 familias, con reparto los sábados. Cobra bastante más que el mercado porque su historia es verificable: fotos reales, visitas guiadas programadas (con reglas de bioseguridad) y cero promesas exageradas. Vende la gallinaza compostada a productores de palta.</p>
<p><b>Lección:</b> en pequeña escala, el valor está en diferenciarse y vender directo.</p>
<h3>Caso B: el que compitió en precio</h3>
<p>Un emprendedor instaló 1,000 gallinas en jaulas y salió a vender a bodegas al precio del mercado mayorista. Cuando subió el maíz, su costo por huevo superó el precio de venta; no tenía reserva de dinero y tuvo que vender las aves antes de tiempo.</p>
<p><b>Lección:</b> competir solo en precio contra granjas grandes es arriesgado. Siempre calcula tu costo por huevo y ten un fondo de reserva.</p>
<h3>Caso C: la asociación</h3>
<p>Cinco pequeños productores de una misma provincia se asociaron para comprar alimento juntos (mejor precio), contratar un veterinario compartido y vender bajo una sola marca a panaderías y a un programa institucional. Juntos podían cumplir volúmenes que solos no lograban.</p>
<p><b>Lección:</b> asociarte te da escala sin perder tu independencia.</p>
<div class="box granja"><span class="bt">Para pensar</span><p>¿A cuál de los tres casos se parece más tu idea? ¿Qué harías para evitar el error del caso B?</p></div>
`}
],

id:"m6", num:6, title:"Contabilidad y costos de tu granja",
src:"Gestión de Negocios Avícolas, curso 4",
intro:"Aquí aprendes a saber, con números, si ganas o pierdes. Sin esto, puedes vender mucho y aun así estar perdiendo dinero.",
lessons:[
{t:"Conceptos contables básicos", html:`
<h3>El vocabulario mínimo</h3>
<div class="tbl"><table>
<tr><th>Concepto</th><th>Qué es</th><th>Ejemplo en tu granja</th></tr>
<tr><td>Activo</td><td>Lo que tienes y te genera valor</td><td>Galpón, equipos, gallinas, alimento en almacén, dinero en caja</td></tr>
<tr><td>Pasivo</td><td>Lo que debes</td><td>Préstamo de la caja municipal, deuda con el proveedor de alimento</td></tr>
<tr><td>Patrimonio</td><td>Lo que realmente es tuyo (activo menos pasivo)</td><td>Tu aporte más las ganancias acumuladas</td></tr>
<tr><td>Ingreso</td><td>Lo que entra por vender</td><td>Venta de huevos, gallinas de descarte, gallinaza</td></tr>
<tr><td>Gasto o costo</td><td>Lo que consumes para producir y vender</td><td>Alimento, vacunas, luz, sueldos, combustible</td></tr>
</table></div>
<h3>Activo fijo y activo biológico</h3>
<ul>
<li><b>Activo fijo:</b> bienes que duran varios años (galpón, jaulas, comederos). Su costo se reparte en su vida útil mediante la <b>depreciación</b>. Ejemplo: equipos de S/ 6,000 que duran 5 años se deprecian S/ 1,200 al año (S/ 100 al mes).</li>
<li><b>Activo biológico:</b> seres vivos que producen, como tus gallinas. Contablemente tienen un tratamiento especial (la norma internacional NIC 41). Para gestionar tu granja, lo práctico es repartir el costo del lote durante sus meses de postura, como verás en la lección de costos.</li>
<li><b>Intangible:</b> bienes que no se tocan, como tu marca o un software.</li>
</ul>
<div class="box idea"><span class="bt">Idea clave</span><p>Separa siempre el dinero de la granja del dinero de tu casa. Una cuenta aparte, aunque sea una billetera digital distinta, ya ayuda mucho.</p></div>
`},
{t:"Estados financieros", html:`
<h3>Tres reportes que debes entender</h3>
<p><b>1. Estado de resultados:</b> ¿gané o perdí en el mes?</p>
<div class="tbl"><table>
<tr><th>Concepto (ejemplo mensual)</th><th class="n">S/</th></tr>
<tr><td>Ventas de huevos</td><td class="n">4,200</td></tr>
<tr><td>(−) Alimento</td><td class="n">2,050</td></tr>
<tr><td>(−) Sanidad, luz, agua, empaque, transporte</td><td class="n">450</td></tr>
<tr><td>(−) Mano de obra</td><td class="n">600</td></tr>
<tr><td>(−) Depreciación de las gallinas</td><td class="n">300</td></tr>
<tr><td>(−) Depreciación de instalaciones</td><td class="n">170</td></tr>
<tr><th>= Utilidad antes de impuestos</th><th class="n">630</th></tr>
</table></div>
<p><b>2. Flujo de caja:</b> ¿cuánto dinero entró y salió realmente? Puedes tener utilidad y aun así quedarte sin efectivo (por ejemplo, si un cliente te debe o si pagaste un préstamo). La depreciación no es salida de dinero, pero el pago de la cuota del préstamo sí.</p>
<p><b>3. Balance general:</b> una foto de lo que tienes (activos), lo que debes (pasivos) y lo que es tuyo (patrimonio) en una fecha. Siempre se cumple: <b>Activo = Pasivo + Patrimonio</b>.</p>
<div class="box granja"><span class="bt">En tu granja</span><p>Cada mes haz, como mínimo, el estado de resultados y el flujo de caja. Te tomará una hora si llevas tus registros al día.</p></div>
`},
{t:"Costos avícolas", html:`
<h3>Clasificar los costos</h3>
<ul>
<li><b>Variables:</b> cambian con la producción. Alimento, empaques, vacunas por ave.</li>
<li><b>Fijos:</b> los pagas produzcas o no. Alquiler, sueldo fijo, depreciación de instalaciones.</li>
<li><b>Directos:</b> se asignan claramente al huevo (alimento, pollitas). <b>Indirectos:</b> se reparten (luz, administración).</li>
</ul>
<h3>El costo de la gallina: "depreciación del lote"</h3>
<p>Las gallinas no son gratis y se "gastan" durante su vida productiva. Se calcula así:</p>
<div class="box idea"><p><b>Depreciación mensual del lote</b> = (costo de todas las pollas − lo que recibirás al vender las de descarte) ÷ meses de postura</p></div>
<p>Ejemplo: 300 pollas a S/ 25 = S/ 7,500. Al final vendes unas 276 gallinas a S/ 12 = S/ 3,312. Si producen 14 meses: (7,500 − 3,312) ÷ 14 = <b>S/ 299 al mes</b>.</p>
<h3>El número más importante: costo por huevo</h3>
<div class="box idea"><p><b>Costo por huevo</b> = costo total del mes ÷ huevos buenos vendibles del mes</p></div>
<p>Si en el mes gastaste S/ 3,500 (incluyendo depreciaciones) y produjiste 6,800 huevos vendibles, tu costo es S/ 0.51 por huevo, es decir S/ 15.40 por plancha de 30. Si vendes la plancha a S/ 14, estás perdiendo aunque no lo notes.</p>
<div class="box ojo"><span class="bt">Error frecuente</span><p>No contar tu propio trabajo. Si tú haces todo y no te pagas, el negocio parece rentable, pero en realidad estás regalando tu tiempo. Ponte un sueldo en los cálculos, aunque sea simbólico.</p></div>
`},
{t:"Indicadores clave (KPI)", html:`
<p>Los indicadores te dicen si tu granja va bien sin esperar a fin de mes. Los valores son referencias para líneas marrones comerciales bien manejadas; compáralos siempre con la guía de tu línea genética.</p>
<div class="tbl"><table>
<tr><th>Indicador</th><th>Cómo se calcula</th><th>Referencia</th></tr>
<tr><td>% de postura (gallina-día)</td><td>Huevos del día ÷ gallinas vivas × 100</td><td>Más de 90% en el pico; promedio del ciclo entre 75% y 85%</td></tr>
<tr><td>Huevos por gallina alojada</td><td>Huevos acumulados ÷ gallinas iniciales</td><td>Alrededor de 300 o más al final del ciclo principal</td></tr>
<tr><td>Consumo de alimento</td><td>Kg de alimento ÷ gallinas vivas (en gramos)</td><td>105 a 120 g por ave al día</td></tr>
<tr><td>Conversión alimenticia</td><td>Kg de alimento ÷ kg de huevo</td><td>Alrededor de 2.0 a 2.3</td></tr>
<tr><td>Mortalidad acumulada</td><td>Muertas ÷ iniciales × 100</td><td>Idealmente menos de 5% a 8% en el ciclo de postura</td></tr>
<tr><td>Peso promedio del huevo</td><td>Peso de 30 huevos ÷ 30</td><td>55 a 65 g según la edad</td></tr>
<tr><td>% huevos rotos o sucios</td><td>Rotos y sucios ÷ total × 100</td><td>Lo más bajo posible; menos de 3% es bueno</td></tr>
<tr><td>Costo por huevo</td><td>Costo total ÷ huevos vendibles</td><td>Debe estar claramente debajo de tu precio</td></tr>
</table></div>
<div class="box granja"><span class="bt">En tu granja</span><p>Revisa el % de postura y el consumo de alimento cada día, y el resto cada semana. Una caída de 3 o 4 puntos de postura de un día para otro es una alerta.</p></div>
`}
],

{
id:"m7", num:7, title:"Finanzas, financiamiento, normas y riesgos",
src:"Planes de Negocios, curso 5 · Gestión de Negocios Avícolas, curso 5",
intro:"Con los costos claros, ahora ves el negocio completo: cuánto necesitas invertir, cuándo lo recuperas, de dónde sacas el dinero, qué obligaciones tienes y qué puede salir mal.",
lessons:[
{t:"Economía para decidir mejor", html:`
<h3>Oferta y demanda del huevo</h3>
<ul>
<li>Si hay <b>menos huevo</b> en el mercado (brotes de influenza, calor fuerte, granjas que reducen lotes), el precio sube.</li>
<li>Si hay <b>exceso</b> (muchas granjas en pico de postura), el precio baja.</li>
<li>La demanda es bastante estable, pero puede bajar cuando la economía de las familias se ajusta.</li>
</ul>
<h3>Factores externos que te afectan</h3>
<ul>
<li><b>Precio internacional del maíz y la soya:</b> define tu costo de alimento.</li>
<li><b>Tipo de cambio:</b> si el dólar sube, el alimento importado se encarece.</li>
<li><b>Clima:</b> olas de calor o eventos como El Niño bajan la postura en la costa.</li>
<li><b>Sanidad nacional:</b> una emergencia sanitaria puede restringir la movilización de aves.</li>
<li><b>Inflación y empleo:</b> influyen en cuánto pueden pagar tus clientes.</li>
</ul>
<div class="box idea"><span class="bt">Idea clave</span><p>No controlas el precio del maíz ni el del huevo, pero sí tu eficiencia (conversión alimenticia, mortalidad, mermas) y tu diferenciación. Enfócate en lo que controlas y ten reservas para lo que no.</p></div>
`},
{t:"Rentabilidad del proyecto", html:`
<h3>Inversión inicial</h3>
<ul>
<li><b>Instalaciones y equipos:</b> galpón o adaptación, mallas, comederos, bebederos, nidos, luz, almacén.</li>
<li><b>Aves:</b> el lote de pollas.</li>
<li><b>Trámites:</b> licencias, registros.</li>
<li><b>Capital de trabajo:</b> dinero para alimento y gastos mientras las ventas se estabilizan. Considera al menos 2 a 3 meses de gastos operativos.</li>
</ul>
<h3>Cómo saber si vale la pena</h3>
<ul>
<li><b>Flujo de caja proyectado:</b> mes a mes, cuánto entra y cuánto sale durante todo el ciclo del lote.</li>
<li><b>Periodo de recuperación:</b> cuántos meses tardas en recuperar lo invertido con el dinero que genera la granja.</li>
<li><b>VAN (valor actual neto):</b> suma de los flujos futuros traídos a valor de hoy, menos la inversión. Si es positivo, el proyecto gana más que lo que te costaría el dinero (por ejemplo, la tasa de un préstamo).</li>
<li><b>TIR (tasa interna de retorno):</b> la rentabilidad anual del proyecto. Compárala con la tasa de tu préstamo o con lo que ganarías en otra opción.</li>
</ul>
<h3>Escenarios</h3>
<p>Nunca te quedes con un solo cálculo. Arma tres:</p>
<ul>
<li><b>Pesimista:</b> precio del huevo 10% más bajo, alimento 10% más caro, postura menor.</li>
<li><b>Esperado:</b> tus datos más realistas.</li>
<li><b>Optimista:</b> buen precio y buen manejo.</li>
</ul>
<p>Si el negocio solo funciona en el escenario optimista, todavía no está listo.</p>
<div class="box granja"><span class="bt">Úsalo ya</span><p>La <b>calculadora</b> del curso (en el menú) hace estos números por ti y te muestra el escenario pesimista.</p></div>
`},
{t:"Fuentes de financiamiento", html:`
<h3>Opciones comunes en el Perú</h3>
<div class="tbl"><table>
<tr><th>Fuente</th><th>Para quién</th><th>Ten en cuenta</th></tr>
<tr><td>Ahorros propios</td><td>Todos</td><td>Sin intereses, pero no arriesgues el dinero de emergencias de tu familia</td></tr>
<tr><td>Familia o socios</td><td>Emprendedores con red de apoyo</td><td>Deja por escrito cuánto aporta cada uno y cómo se reparten ganancias y pérdidas</td></tr>
<tr><td>Agrobanco</td><td>Pequeños productores agropecuarios</td><td>Banco estatal orientado al agro; revisa productos vigentes y requisitos</td></tr>
<tr><td>Cajas municipales y rurales, cooperativas</td><td>Micro y pequeños negocios</td><td>Compara la TCEA (costo total del crédito), no solo la tasa</td></tr>
<tr><td>Crédito de proveedores</td><td>Clientes con historial</td><td>Plazos de pago para alimento o aves</td></tr>
<tr><td>Fondos concursables (por ejemplo PROCOMPITE o programas de MIDAGRI)</td><td>Normalmente asociaciones u organizaciones de productores</td><td>Convocatorias con fechas; suelen exigir cofinanciamiento y estar asociado</td></tr>
</table></div>
<h3>Reglas sanas</h3>
<ul>
<li>Empieza pequeño y crece con lo que el negocio demuestra.</li>
<li>La cuota mensual del préstamo no debería comerse más de una parte moderada del flujo de caja esperado; deja margen para meses malos.</li>
<li>Financia activos de largo plazo (galpón) con créditos de más plazo, y el capital de trabajo con plazos cortos.</li>
<li>Guarda un <b>fondo de reserva</b> de al menos 2 a 3 meses de alimento.</li>
</ul>
`},
{t:"Obligaciones tributarias y financieras", html:`
<h3>Formalizarte paso a paso</h3>
<ol>
<li><b>RUC en SUNAT</b> como persona natural con negocio, o constituyendo una empresa (por ejemplo, EIRL o SAC) si tendrás socios o quieres separar responsabilidades.</li>
<li><b>Elegir régimen tributario:</b> existen el Nuevo RUS, el Régimen Especial (RER), el Régimen MYPE Tributario y el Régimen General. Cada uno tiene límites de ingresos, tipos de comprobante y tasas distintas, y cambian con el tiempo. Si venderás a negocios que piden factura, el Nuevo RUS no te sirve porque no permite emitirla.</li>
<li><b>IGV:</b> algunos productos agrarios primarios tienen tratamiento especial en la Ley del IGV. Confirma con un contador si tu venta de huevos está gravada o exonerada.</li>
<li><b>Régimen agrario:</b> existe un régimen laboral y tributario para la actividad agraria (Ley 31110). Consulta si tu actividad califica.</li>
<li><b>Comprobantes electrónicos</b> y libros contables según tu régimen.</li>
<li><b>REMYPE:</b> inscribirte como micro o pequeña empresa te da acceso a beneficios laborales y programas.</li>
</ol>
<div class="box ojo"><span class="bt">Importante</span><p>Las reglas tributarias cambian. Antes de decidir, confirma en SUNAT o con un contador. No soy asesor tributario ni legal; esta lección te da el mapa para hacer las preguntas correctas.</p></div>
<h3>Disciplina financiera</h3>
<ul>
<li>Guarda todos tus comprobantes de compra: sustentan tus costos.</li>
<li>Paga tus cuotas a tiempo: un buen historial crediticio te abre mejores créditos después.</li>
<li>Revisa tus números cada mes, no solo cuando algo va mal.</li>
</ul>
`},
{t:"Riesgos y cómo mitigarlos", html:`
<h3>Mapa de riesgos</h3>
<div class="tbl"><table>
<tr><th>Riesgo</th><th>Probabilidad</th><th>Impacto</th><th>Cómo mitigarlo</th></tr>
<tr><td>Brote sanitario (influenza aviar, Newcastle)</td><td>Media</td><td>Muy alto</td><td>Bioseguridad estricta, vacunación, malla antiaves, notificación rápida</td></tr>
<tr><td>Sube el precio del alimento</td><td>Alta</td><td>Alto</td><td>Fondo de reserva, compras planificadas, mejorar conversión, precios revisables con clientes</td></tr>
<tr><td>Baja el precio del huevo</td><td>Media</td><td>Alto</td><td>Diferenciación, venta directa, contratos con precio pactado</td></tr>
<tr><td>Olas de calor</td><td>Media</td><td>Medio</td><td>Ventilación, sombra, agua fresca</td></tr>
<tr><td>Cliente grande que no paga o se va</td><td>Media</td><td>Alto</td><td>Diversificar clientes, límites de crédito</td></tr>
<tr><td>Robo de aves o huevos</td><td>Media</td><td>Medio</td><td>Cerco, perro, iluminación, inventario diario</td></tr>
<tr><td>Cambio de normas o multas</td><td>Baja</td><td>Medio</td><td>Formalización y contacto con SENASA y municipalidad</td></tr>
</table></div>
<p>Califica tú mismo probabilidad e impacto para tu zona: lo que importa es atender primero los riesgos que combinan alta probabilidad con alto impacto.</p>
<div class="box idea"><span class="bt">Idea clave</span><p>El riesgo sanitario es el único que puede llevar tu producción a cero de un día para otro. Por eso la bioseguridad no es un gasto: es tu seguro.</p></div>
`}
],

id:"m8", num:8, title:"Organización y personas",
src:"Gestión de Negocios Avícolas, curso 6",
intro:"Aunque al inicio seas tú con una sola persona de apoyo, la granja necesita orden: quién hace qué, cuándo y cómo. Así puedes crecer sin que todo dependa de ti.",
lessons:[
{t:"Cultura y estructura", html:`
<h3>La cultura de tu granja</h3>
<p>La cultura es "cómo se hacen las cosas aquí". En una granja avícola, tres valores deben estar por encima de todo:</p>
<ul>
<li><b>Bioseguridad sin excepciones:</b> nadie se salta el pediluvio "porque es rápido".</li>
<li><b>Constancia:</b> las aves necesitan la misma rutina todos los días, domingos y feriados incluidos.</li>
<li><b>Registro honesto:</b> anotar la verdad, incluso los errores y las muertes.</li>
</ul>
<h3>Funciones básicas</h3>
<div class="tbl"><table>
<tr><th>Función</th><th>Tareas</th><th>Al inicio la hace</th></tr>
<tr><td>Producción</td><td>Alimentar, agua, recoger huevos, limpieza, registros</td><td>Operario o tú</td></tr>
<tr><td>Sanidad</td><td>Vacunas, observación diaria, contacto con veterinario</td><td>Tú, con asesoría</td></tr>
<tr><td>Comercial</td><td>Ventas, pedidos, reparto, cobranza, redes</td><td>Tú</td></tr>
<tr><td>Administración</td><td>Compras, pagos, contabilidad, trámites</td><td>Tú y un contador externo</td></tr>
</table></div>
<h3>Rutina diaria escrita</h3>
<p>Escribe la rutina en una hoja visible: por ejemplo, 6:00 revisar agua y alimento; 8:00, 11:00, 14:00 y 16:30 recoger huevos; 9:00 clasificar; 17:00 registro del día y retiro de aves muertas; cierre y revisión de luces. Si mañana te enfermas, otra persona puede seguirla.</p>
`},
{t:"Liderazgo y equipo", html:`
<h3>Liderar en pequeño</h3>
<ul>
<li><b>Da el ejemplo:</b> si tú cumples la bioseguridad, los demás también.</li>
<li><b>Explica el porqué:</b> alguien que entiende por qué no se lava el huevo con agua lo hace bien sin que lo vigiles.</li>
<li><b>Reuniones cortas:</b> 10 minutos a la semana para revisar indicadores y problemas.</li>
<li><b>Reconoce lo bien hecho</b> en el momento, y corrige en privado.</li>
</ul>
<h3>Trabajo en equipo</h3>
<p>Comparte los indicadores con tu equipo: si todos ven el % de postura y los huevos rotos, todos se sienten parte del resultado. Un pequeño incentivo por metas alcanzables (por ejemplo, menos de 2% de rotos en el mes) puede mejorar mucho el cuidado.</p>
`},
{t:"Contratar y retener personal", html:`
<h3>Reclutamiento y selección</h3>
<ul>
<li><b>Perfil:</b> responsable, puntual, que no tenga aves propias en casa (riesgo sanitario) y que acepte las reglas de bioseguridad.</li>
<li><b>Busca por recomendación</b> de personas de confianza de la zona.</li>
<li><b>Periodo de prueba</b> con tareas reales y observación.</li>
</ul>
<h3>Capacitación inicial</h3>
<ol>
<li>Reglas de bioseguridad y por qué existen.</li>
<li>Rutina diaria y registros.</li>
<li>Manejo del huevo: recojo, limpieza en seco, clasificación.</li>
<li>Señales de alarma en las aves y a quién avisar.</li>
<li>Uso del equipo de protección (mascarilla y guantes, sobre todo al limpiar la cama, por el polvo y el amoníaco).</li>
</ol>
<h3>Motivación y retención</h3>
<ul>
<li>Pago puntual y justo; es lo primero.</li>
<li>Trato respetuoso y horarios claros, con días de descanso organizados.</li>
<li>Oportunidad de aprender y asumir más responsabilidad cuando la granja crezca.</li>
</ul>
<div class="box ojo"><span class="bt">Formalidad laboral</span><p>Contratar implica obligaciones (contrato, planilla, seguro de salud). El régimen MYPE y el régimen agrario tienen reglas propias; confírmalas con un contador o en el Ministerio de Trabajo antes de contratar.</p></div>
`}
],

{
id:"m9", num:9, title:"Plan integrador: tu plan de negocio",
src:"Planes de Negocios, curso 6",
intro:"Aquí juntas todo lo aprendido en un solo documento: tu plan de negocio. Sigue las tres asesorías y llena la plantilla en la sección 'Mi plan de negocio' del menú.",
lessons:[
{t:"Estructura del plan", html:`
<h3>Las 10 partes de tu plan</h3>
<ol>
<li><b>Resumen ejecutivo:</b> tu negocio en media página (se escribe al final).</li>
<li><b>Idea y propuesta de valor:</b> qué vendes, a quién y por qué te elegirían (módulo 1).</li>
<li><b>Mercado y competencia:</b> tamaño, segmentos, precios y competidores (módulo 1).</li>
<li><b>Marketing y marca:</b> 4P, marca, redes (módulo 2).</li>
<li><b>Comercialización:</b> canales, clientes clave, reparto (módulo 3).</li>
<li><b>Plan de operaciones:</b> ubicación, sistema, número de aves, instalaciones, sanidad, proveedores (módulo 4).</li>
<li><b>Sostenibilidad:</b> gallinaza, bienestar, comunidad (módulo 5).</li>
<li><b>Organización y aspectos legales:</b> equipo, formalización, permisos (módulos 7 y 8).</li>
<li><b>Plan financiero:</b> inversión, costos, precio, flujo, recuperación, escenarios y financiamiento (módulos 6 y 7).</li>
<li><b>Riesgos y cronograma:</b> qué puede fallar y los pasos con fechas.</li>
</ol>
<div class="box idea"><span class="bt">Idea clave</span><p>Un buen plan no es largo: es coherente. El número de aves debe cuadrar con tus clientes, el precio con tus costos, y la inversión con tu financiamiento.</p></div>
`},
{t:"Asesoría 1: la idea y el mercado", html:`
<h3>Objetivo</h3>
<p>Dejar claras las partes 2 a 5: qué, a quién, cómo y a qué precio.</p>
<h3>Pasos</h3>
<ol>
<li>Escribe tu propuesta en una frase (módulo 1, lección 4).</li>
<li>Resume tu investigación: precios que viste, clientes con los que hablaste y qué te dijeron.</li>
<li>Define cuántos huevos puedes vender por semana con pruebas o intenciones de compra reales. <b>Este número decide cuántas gallinas tener</b>, no al revés.</li>
<li>Calcula las gallinas necesarias: huevos por semana ÷ 7 ÷ 0.80 (postura promedio). Ejemplo: 1,500 huevos semanales ÷ 7 ÷ 0.8 ≈ 270 gallinas; suma un margen por mortalidad.</li>
<li>Define marca, presentaciones, precio tentativo y canales.</li>
</ol>
<h3>Preguntas de revisión</h3>
<ul>
<li>¿Tengo evidencia de que alguien me comprará, o solo lo supongo?</li>
<li>¿Mi diferenciación es real y la puedo cumplir cada semana?</li>
<li>¿Qué haré con los huevos si un cliente grande falla?</li>
</ul>
`},
{t:"Asesoría 2: operaciones y números", html:`
<h3>Objetivo</h3>
<p>Completar las partes 6 a 9 y comprobar que el negocio es rentable.</p>
<h3>Pasos</h3>
<ol>
<li>Define ubicación, sistema de crianza, número de aves y lista de instalaciones con cotizaciones reales.</li>
<li>Escribe tu plan sanitario con el veterinario y tu protocolo de bioseguridad.</li>
<li>Abre la <b>calculadora</b> y reemplaza los valores de ejemplo por tus cotizaciones.</li>
<li>Revisa: costo por huevo, utilidad mensual, precio de equilibrio y tiempo de recuperación.</li>
<li>Prueba el escenario pesimista. Si sale negativo, ajusta: ¿más precio con diferenciación?, ¿menos inversión?, ¿mejor conversión?</li>
<li>Define cuánto dinero necesitas en total (inversión + capital de trabajo) y de dónde saldrá.</li>
</ol>
<div class="box ojo"><span class="bt">Señal de alerta</span><p>Si tu precio de equilibrio está por encima del precio que pagan tus clientes, no empieces así. Cambia el modelo antes de invertir.</p></div>
`},
{t:"Revisión final del plan", html:`
<h3>Lista de verificación</h3>
<ul>
<li>¿Las ventas proyectadas se basan en clientes reales y no en deseos?</li>
<li>¿El número de gallinas cuadra con esas ventas?</li>
<li>¿El precio cubre el costo por huevo con margen, incluyendo tu sueldo y las depreciaciones?</li>
<li>¿Incluiste capital de trabajo y un fondo de reserva?</li>
<li>¿El negocio aguanta el escenario pesimista?</li>
<li>¿Tienes plan sanitario, veterinario y protocolo de bioseguridad?</li>
<li>¿Sabes qué trámites necesitas y en qué orden?</li>
<li>¿Tienes identificados los 5 riesgos principales con su mitigación?</li>
<li>¿Hay un cronograma con fechas concretas?</li>
</ul>
<h3>Preséntalo en 3 minutos</h3>
<p>Como en la revisión final de un diploma, practica contar tu plan en 3 minutos a alguien de confianza (o a un asesor de crédito): el problema, tu solución, tus clientes, tus números clave y lo que necesitas. Si puedes explicarlo así, está claro.</p>
<h3>Cronograma tipo</h3>
<ul class="timeline">
<li><b>Mes 1:</b> investigación de mercado, cotizaciones, trámites iniciales.</li>
<li><b>Mes 2:</b> adecuación del galpón, compra de equipos, contacto con veterinario, preventa con clientes.</li>
<li><b>Mes 3:</b> limpieza y desinfección, llegada de pollas recriadas, inicio de registros.</li>
<li><b>Meses 3 y 4:</b> inicio de postura, primeras ventas, ajuste de precios y rutas.</li>
<li><b>Mes 6:</b> primera evaluación completa con indicadores reales.</li>
</ul>
`}
],
